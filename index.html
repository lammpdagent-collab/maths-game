<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學遊戲館 | Maths Mini Games</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- GSAP for UI Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Mochiyom+Pop+One&family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #a8edf0 0%, #fed6e3 50%, #fff3b0 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }
        .cute-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border: 3px solid #ffffff;
            box-shadow: 0 8px 20px -6px rgba(255, 182, 193, 0.35);
        }
        .cute-card-hover {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .cute-card-hover:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 12px 25px -8px rgba(255, 150, 180, 0.4);
        }
        .btn-bounce {
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;
        }
        .btn-bounce:hover {
            transform: translateY(-1.5px);
        }
        .btn-bounce:active {
            transform: scale(0.93) translateY(1px);
        }
        .glass-pill {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(6px);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
        }
        .modal-enter {
            animation: modalIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9) translateY(12px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #fdf2f8;
            border-radius: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #f472b6;
            border-radius: 6px;
        }
    </style>
</head>
<body class="text-slate-700 flex flex-col min-h-screen overflow-x-hidden">

    <!-- Top Navigation Bar (Compact) -->
    <header class="sticky top-0 z-40 px-2 py-2 sm:px-4">
        <div class="max-w-7xl mx-auto cute-card rounded-2xl px-3 py-2 flex items-center justify-between gap-2 shadow-sm">
            
            <!-- Logo & Brand -->
            <a href="#" class="flex items-center space-x-2 group">
                <div class="w-9 h-9 bg-gradient-to-tr from-pink-400 to-rose-400 rounded-xl flex items-center justify-center text-white text-xl shadow-sm border-2 border-white group-hover:rotate-12 transition-transform">
                    <i class="fa-solid fa-gamepad"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-xl font-black text-pink-600 leading-none tracking-wide">
                        數學遊戲館 <span class="text-[10px] sm:text-xs font-bold bg-pink-100 text-pink-500 px-1.5 py-0.2 rounded-md border border-pink-200">Arcade</span>
                    </h1>
                </div>
            </a>

            <!-- Quick Stats & Actions -->
            <div class="flex items-center gap-2">
                <div class="hidden md:flex items-center space-x-2 text-[11px] font-bold bg-pink-50 px-2.5 py-1 rounded-xl border border-pink-200">
                    <div class="flex items-center text-pink-500">
                        <i class="fa-solid fa-cubes mr-1"></i>
                        <span>總計: <strong id="stat-total-games" class="text-pink-600 font-black">0</strong></span>
                    </div>
                    <div class="h-2.5 w-0.5 bg-pink-200"></div>
                    <div class="flex items-center text-rose-500">
                        <i class="fa-solid fa-heart mr-1"></i>
                        <span>收藏: <strong id="stat-fav-games" class="text-rose-600 font-black">0</strong></span>
                    </div>
                </div>

                <!-- Random Game Launcher -->
                <button id="btn-random-game" class="btn-bounce bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold px-2.5 py-1.5 rounded-xl border-2 border-white shadow-sm text-xs flex items-center gap-1">
                    <i class="fa-solid fa-dice text-sm"></i>
                    <span>隨機玩</span>
                </button>

                <!-- GitHub Repo Link -->
                <a id="btn-github" href="https://github.com" target="_blank" rel="noopener noreferrer" class="btn-bounce bg-slate-800 hover:bg-slate-900 text-white font-bold p-1.5 sm:px-2.5 sm:py-1.5 rounded-xl border-2 border-white shadow-sm text-xs flex items-center gap-1">
                    <i class="fa-brands fa-github text-sm"></i>
                    <span class="hidden md:inline">GitHub</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-2 sm:px-4 my-2 w-full flex-grow flex flex-col justify-between">
        
        <!-- Compact Hero & Filter Header -->
        <div class="cute-card rounded-2xl p-3 mb-3 shadow-sm">
            <div class="flex flex-col md:flex-row items-center justify-between gap-2.5">
                
                <!-- Category Tabs -->
                <div class="flex items-center gap-1 overflow-x-auto w-full md:w-auto pb-1 md:pb-0 scrollbar-none" id="category-tabs">
                    <!-- Rendered by JS -->
                </div>

                <!-- Search Input & Sort Options -->
                <div class="flex items-center gap-2 w-full md:w-auto shrink-0">
                    <!-- Search Input -->
                    <div class="relative flex-grow md:w-48">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-pink-400 text-xs"></i>
                        <input type="text" id="search-input" placeholder="搜尋遊戲..." class="w-full pl-8 pr-7 py-1.5 bg-pink-50/80 border-2 border-pink-200 rounded-xl text-xs font-semibold text-slate-700 placeholder-pink-300 focus:outline-none focus:border-pink-400 transition-all">
                        <button id="btn-clear-search" class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-pink-400 hover:text-pink-600 text-xs">
                            <i class="fa-solid fa-circle-xmark"></i>
                        </button>
                    </div>

                    <!-- Sort Dropdown -->
                    <select id="sort-select" class="bg-pink-50/80 border-2 border-pink-200 text-pink-600 font-bold rounded-xl px-2 py-1.5 text-xs focus:outline-none focus:border-pink-400">
                        <option value="newest">✨ 最新</option>
                        <option value="popular">🔥 熱門</option>
                        <option value="title">🔤 排序</option>
                    </select>
                </div>
            </div>

            <!-- Active Filter Indicator & Favorites Toggle -->
            <div class="flex items-center justify-between pt-2 mt-2 border-t border-pink-100 text-xs font-bold text-slate-500">
                <div class="flex items-center gap-1.5">
                    <span>共找到 <strong id="filtered-count" class="text-pink-600 font-black">0</strong> 款遊戲</span>
                    <span class="text-slate-300">•</span>
                    <span id="page-indicator-text" class="text-pink-400">第 1 / 1 頁</span>
                </div>
                <button id="btn-toggle-fav-only" class="text-pink-500 hover:text-pink-600 flex items-center gap-1 glass-pill px-2.5 py-0.5 rounded-lg btn-bounce text-[11px]">
                    <i class="fa-solid fa-heart text-rose-400"></i>
                    <span id="fav-toggle-text">只看收藏</span>
                </button>
            </div>
        </div>

        <!-- Compact Game Cards Grid (Fixed 8 per page layout) -->
        <div id="game-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 my-auto">
            <!-- Compact Game Cards Rendered by JS -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-10 cute-card rounded-2xl my-auto">
            <div class="text-pink-300 text-4xl mb-2">
                <i class="fa-solid fa-ghost"></i>
            </div>
            <h3 class="text-base font-bold text-slate-600 mb-1">找不到相關遊戲</h3>
            <p class="text-xs text-slate-400">嘗試更換關鍵字或切換至「全部遊戲」類別吧！</p>
            <button id="btn-reset-filters" class="mt-3 bg-pink-500 hover:bg-pink-600 text-white font-bold px-3 py-1.5 rounded-xl text-xs shadow-sm border border-white btn-bounce">
                重設篩選條件
            </button>
        </div>

        <!-- Pagination Navigation Bar (No Scrolling Solution) -->
        <div id="pagination-wrapper" class="flex items-center justify-center gap-2 mt-3 mb-1">
            <button id="btn-prev-page" class="btn-bounce bg-white hover:bg-pink-50 text-pink-600 font-bold px-3 py-1.5 rounded-xl border-2 border-pink-200 text-xs shadow-sm disabled:opacity-40 disabled:pointer-events-none flex items-center gap-1">
                <i class="fa-solid fa-chevron-left"></i> 上一頁
            </button>

            <div id="pagination-pages" class="flex items-center gap-1">
                <!-- Page Numbers Inserted Here -->
            </div>

            <button id="btn-next-page" class="btn-bounce bg-white hover:bg-pink-50 text-pink-600 font-bold px-3 py-1.5 rounded-xl border-2 border-pink-200 text-xs shadow-sm disabled:opacity-40 disabled:pointer-events-none flex items-center gap-1">
                下一頁 <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

    </main>

    <!-- Game Player Modal -->
    <div id="modal-game-player" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-2 hidden">
        <div class="cute-card modal-enter rounded-2xl max-w-5xl w-full h-[92vh] flex flex-col overflow-hidden relative shadow-2xl">
            <!-- Modal Header -->
            <div class="bg-pink-100/90 px-3 py-2 border-b border-pink-200 flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-2">
                    <span id="player-game-icon" class="text-xl">🎮</span>
                    <div>
                        <h3 id="player-game-title" class="font-black text-slate-800 text-sm sm:text-base leading-tight">遊戲名稱</h3>
                        <p id="player-game-tags" class="text-[10px] text-pink-500 font-bold">標籤</p>
                    </div>
                </div>
                <div class="flex items-center gap-1.5">
                    <button id="btn-player-fullscreen" class="btn-bounce bg-white text-slate-700 hover:bg-pink-50 w-8 h-8 rounded-lg border border-pink-200 flex items-center justify-center text-xs font-bold shadow-sm" title="新分頁全螢幕開啟">
                        <i class="fa-solid fa-expand"></i>
                    </button>
                    <button id="btn-close-player" class="btn-bounce bg-rose-500 hover:bg-rose-600 text-white w-8 h-8 rounded-lg border-2 border-white flex items-center justify-center text-xs font-bold shadow-md">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>
            <!-- Game Iframe Screen -->
            <div class="flex-grow bg-slate-100 relative">
                <iframe id="game-iframe" src="" class="w-full h-full border-0"></iframe>
            </div>
        </div>
    </div>

    <!-- Instructions / Info Modal -->
    <div id="modal-game-info" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-3 hidden">
        <div class="cute-card modal-enter rounded-2xl max-w-sm w-full p-4 relative">
            <button id="btn-close-info" class="absolute top-3 right-3 text-slate-400 hover:text-slate-600 text-base font-bold">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="text-center mb-3">
                <div id="info-icon" class="text-4xl mb-1">🎮</div>
                <h3 id="info-title" class="text-lg font-black text-pink-600">遊戲詳細說明</h3>
                <div id="info-tags" class="flex justify-center gap-1 mt-1 flex-wrap"></div>
            </div>
            <div class="space-y-2 text-xs text-slate-600">
                <div class="bg-pink-50/80 p-2.5 rounded-xl border border-pink-100">
                    <strong class="text-pink-600 font-bold block mb-0.5">📖 遊戲介紹：</strong>
                    <p id="info-desc">無詳細說明。</p>
                </div>
                <div class="bg-sky-50/80 p-2.5 rounded-xl border border-sky-100">
                    <strong class="text-sky-600 font-bold block mb-0.5">🎮 操作指南：</strong>
                    <p id="info-controls">無特殊操作需求。</p>
                </div>
            </div>
            <button id="btn-info-play-now" class="w-full mt-3 bg-pink-500 hover:bg-pink-600 text-white font-bold py-2 rounded-xl shadow-md border-2 border-white btn-bounce text-xs flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-play"></i> 立即遊玩
            </button>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-4 right-4 z-50 bg-slate-800 text-white font-bold px-3 py-2 rounded-xl shadow-xl flex items-center gap-2 text-xs border border-white translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-base"></i>
        <span id="toast-msg">操作成功！</span>
    </div>

    <!-- Compact Footer -->
    <footer class="py-2 text-center text-[11px] text-pink-400 font-semibold border-t border-pink-200/40 bg-white/30 shrink-0">
        <p> Made with ❤️ for Github Pages | 數學遊戲館</p>
    </footer>

    <script>
        const GAMES_DATA = [
            {
                id: "make-tens-jelly-pop",
                title: "合十果凍消消樂",
                englishTitle: "Make Tens Jelly Pop",
                category: "puzzle",
                categoryName: "益智合十",
                icon: "🍡",
                path: "./games/make-tens-jelly-pop/make-tens-jelly-pop.html",
                badge: "HOT 🔥",
                badgeBg: "bg-rose-500",
                description: "移動頂層果凍，相加等於 10 即可輕鬆消除！考驗心算與策略。",
                controls: "滑鼠拖曳或觸控最上方的果凍至其他欄位。",
                difficulty: "⭐",
                dateAdded: "2026-09-20",
                playsCount: 0,
                isFeatured: true
            },
            {
                id: "multiplication-hunter",
                title: "乘法獵人",
                englishTitle: "Multiplication Hunter",
                category: "math",
                categoryName: "數字",
                icon: "🎯",
                path: "./games/multiplication-hunter/multiplication-hunter.html",
                badge: "NEW",
                badgeBg: "bg-emerald-500",
                description: "Retro 拉霸風格乘法練習，瞄準正確答案開槍獵捕！",
                controls: "滑鼠點擊或觸控選擇答案。",
                difficulty: "⭐",
                dateAdded: "2026-09-20",
                playsCount: 0,
                isFeatured: false
            },
            {
                id: "geoboard-game",
                title: "幾何釘板",
                englishTitle: "Cyberboard 2077 Geoboard",
                category: "math",
                categoryName: "數字",
                icon: "📐",
                path: "./games/geoboard-game/geoboard-game.html",
                badge: "NEW",
                badgeBg: "bg-emerald-500",
                description: "Cyberpunk 釘板遊戲：畫出等長斜線段，挑戰模式更可組成菱形！",
                controls: "滑鼠或觸控點選兩個釘點畫線，可切換練習／挑戰模式。",
                difficulty: "⭐⭐",
                dateAdded: "2026-09-21",
                playsCount: 0,
                isFeatured: false
            }
        ];

        const CATEGORIES = [
            { id: "all", label: "全部", icon: "fa-border-all" },
            { id: "puzzle", label: "益智", icon: "fa-brain" },
            { id: "math", label: "數字", icon: "fa-calculator" },
            { id: "action", label: "動作", icon: "fa-bolt" },
            { id: "casual", label: "休閒", icon: "fa-face-smile" }
        ];

        // State Management
        let currentCategory = "all";
        let searchQuery = "";
        let sortBy = "newest";
        let favoritesOnly = false;
        let selectedGameForInfo = null;

        // Pagination State (No scrolling solution)
        let currentPage = 1;
        const ITEMS_PER_PAGE = 8; // Displays 8 compact cards per page cleanly

        const STORAGE_FAVS_KEY = "jelly_arcade_favs";

        document.addEventListener("DOMContentLoaded", () => {
            renderCategoryTabs();
            renderGamesGrid();
            updateStats();
            setupEventListeners();
        });

        function getFavorites() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_FAVS_KEY)) || [];
            } catch (e) {
                return [];
            }
        }

        function toggleFavorite(gameId) {
            let favs = getFavorites();
            if (favs.includes(gameId)) {
                favs = favs.filter(id => id !== gameId);
                showToast("已從收藏移除", "fa-heart-crack", "text-pink-400");
            } else {
                favs.push(gameId);
                showToast("已加入我的收藏 ❤️", "fa-heart", "text-rose-500");
            }
            localStorage.setItem(STORAGE_FAVS_KEY, JSON.stringify(favs));
            renderGamesGrid();
            updateStats();
        }

        function renderCategoryTabs() {
            const container = document.getElementById("category-tabs");
            container.innerHTML = CATEGORIES.map(cat => {
                const isActive = cat.id === currentCategory;
                const activeClass = isActive 
                    ? "bg-pink-500 text-white shadow-sm border-pink-500" 
                    : "bg-pink-50/80 text-pink-600 hover:bg-pink-100 border-pink-200";
                
                return `
                    <button data-cat="${cat.id}" class="cat-tab-btn px-2.5 py-1 rounded-xl text-xs font-bold border transition-all shrink-0 flex items-center gap-1 ${activeClass}">
                        <i class="fa-solid ${cat.icon}"></i>
                        <span>${cat.label}</span>
                    </button>
                `;
            }).join("");

            container.querySelectorAll(".cat-tab-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    currentCategory = btn.dataset.cat;
                    currentPage = 1; // Reset to page 1
                    renderCategoryTabs();
                    renderGamesGrid();
                });
            });
        }

        function getFilteredAndSortedGames() {
            const favs = getFavorites();
            
            return GAMES_DATA.filter(game => {
                if (currentCategory !== "all" && game.category !== currentCategory) return false;
                if (favoritesOnly && !favs.includes(game.id)) return false;
                if (searchQuery.trim() !== "") {
                    const q = searchQuery.toLowerCase();
                    const matchTitle = game.title.toLowerCase().includes(q);
                    const matchEng = game.englishTitle.toLowerCase().includes(q);
                    const matchDesc = game.description.toLowerCase().includes(q);
                    if (!matchTitle && !matchEng && !matchDesc) return false;
                }
                return true;
            }).sort((a, b) => {
                if (sortBy === "newest") return new Date(b.dateAdded) - new Date(a.dateAdded);
                if (sortBy === "popular") return b.playsCount - a.playsCount;
                if (sortBy === "title") return a.title.localeCompare(b.title, 'zh-Hant');
                return 0;
            });
        }

        function renderGamesGrid() {
            const grid = document.getElementById("game-grid");
            const emptyState = document.getElementById("empty-state");
            const filteredCountEl = document.getElementById("filtered-count");
            const pageIndicatorEl = document.getElementById("page-indicator-text");

            const allFilteredGames = getFilteredAndSortedGames();
            const totalItems = allFilteredGames.length;
            const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE) || 1;

            if (currentPage > totalPages) currentPage = totalPages;

            filteredCountEl.innerText = totalItems;
            pageIndicatorEl.innerText = `第 ${currentPage} / ${totalPages} 頁`;

            if (totalItems === 0) {
                grid.innerHTML = "";
                emptyState.classList.remove("hidden");
                renderPagination(0, 1);
                return;
            }

            emptyState.classList.add("hidden");

            // Slice games array for current page
            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const pagedGames = allFilteredGames.slice(startIndex, startIndex + ITEMS_PER_PAGE);
            const favs = getFavorites();

            grid.innerHTML = pagedGames.map(game => {
                const isFav = favs.includes(game.id);
                
                return `
                    <div class="cute-card cute-card-hover rounded-2xl p-3 flex flex-col justify-between relative overflow-hidden group">
                        
                        <!-- Top Bar: Badge & Fav -->
                        <div class="flex items-center justify-between mb-1.5 z-10 relative">
                            <span class="text-[10px] font-black px-2 py-0.5 rounded-lg text-white ${game.badgeBg} shadow-xs">
                                ${game.badge}
                            </span>
                            <button onclick="toggleFavorite('${game.id}')" class="w-7 h-7 rounded-full bg-pink-50 hover:bg-pink-100 flex items-center justify-center text-xs transition-transform btn-bounce shadow-xs">
                                <i class="fa-${isFav ? 'solid' : 'regular'} fa-heart ${isFav ? 'text-rose-500' : 'text-slate-400'}"></i>
                            </button>
                        </div>

                        <!-- Compact Game Content -->
                        <div class="flex items-center gap-2.5 my-1">
                            <div class="w-12 h-12 bg-gradient-to-tr from-pink-100 to-sky-100 rounded-xl flex items-center justify-center text-2xl shrink-0 shadow-inner border border-white group-hover:scale-105 transition-transform">
                                ${game.icon}
                            </div>
                            <div class="min-w-0 flex-grow">
                                <h3 class="font-extrabold text-slate-800 text-sm leading-snug truncate group-hover:text-pink-600 transition-colors">${game.title}</h3>
                                <p class="text-[10px] font-bold text-pink-400 truncate">${game.categoryName} • 難度 ${game.difficulty}</p>
                                <p class="text-[11px] text-slate-500 line-clamp-1 leading-normal mt-0.5">${game.description}</p>
                            </div>
                        </div>

                        <!-- Compact Action Buttons -->
                        <div class="pt-2 border-t border-pink-100/80 flex items-center gap-1.5 mt-1.5">
                            <button onclick="launchGame('${game.id}')" class="flex-grow bg-pink-500 hover:bg-pink-600 text-white font-bold py-1.5 rounded-xl text-xs shadow-sm border border-white btn-bounce flex items-center justify-center gap-1">
                                <i class="fa-solid fa-gamepad text-xs"></i> 開始
                            </button>
                            <button onclick="openGameInfo('${game.id}')" class="bg-pink-100 hover:bg-pink-200 text-pink-600 font-bold p-1.5 rounded-xl text-xs border border-pink-200 btn-bounce" title="詳細說明">
                                <i class="fa-solid fa-circle-info"></i>
                            </button>
                        </div>

                    </div>
                `;
            }).join("");

            renderPagination(totalPages, currentPage);
        }

        // Render Pagination Control Buttons
        function renderPagination(totalPages, page) {
            const btnPrev = document.getElementById("btn-prev-page");
            const btnNext = document.getElementById("btn-next-page");
            const pagesContainer = document.getElementById("pagination-pages");

            btnPrev.disabled = page <= 1;
            btnNext.disabled = page >= totalPages;

            btnPrev.onclick = () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderGamesGrid();
                }
            };

            btnNext.onclick = () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    renderGamesGrid();
                }
            };

            let pageHTML = "";
            for (let i = 1; i <= totalPages; i++) {
                const isCurrent = i === page;
                const activeStyle = isCurrent 
                    ? "bg-pink-500 text-white font-black shadow-sm border-pink-500 scale-105" 
                    : "bg-white text-pink-600 hover:bg-pink-50 font-bold border-pink-200";

                pageHTML += `
                    <button onclick="goToPage(${i})" class="w-7 h-7 rounded-xl border text-xs flex items-center justify-center transition-all btn-bounce ${activeStyle}">
                        ${i}
                    </button>
                `;
            }
            pagesContainer.innerHTML = pageHTML;
        }

        function goToPage(page) {
            currentPage = page;
            renderGamesGrid();
        }

        function updateStats() {
            document.getElementById("stat-total-games").innerText = GAMES_DATA.length;
            document.getElementById("stat-fav-games").innerText = getFavorites().length;
        }

        function launchGame(gameId) {
            const game = GAMES_DATA.find(g => g.id === gameId);
            if (!game) return;

            game.playsCount++;
            const modal = document.getElementById("modal-game-player");
            const iframe = document.getElementById("game-iframe");
            
            document.getElementById("player-game-title").innerText = game.title;
            document.getElementById("player-game-icon").innerText = game.icon;
            document.getElementById("player-game-tags").innerText = `${game.categoryName} • 難度 ${game.difficulty}`;

            iframe.src = game.path;
            document.getElementById("btn-player-fullscreen").onclick = () => {
                window.open(game.path, '_blank');
            };

            modal.classList.remove("hidden");
        }

        function openGameInfo(gameId) {
            const game = GAMES_DATA.find(g => g.id === gameId);
            if (!game) return;

            selectedGameForInfo = game;
            document.getElementById("info-icon").innerText = game.icon;
            document.getElementById("info-title").innerText = game.title;
            document.getElementById("info-desc").innerText = game.description;
            document.getElementById("info-controls").innerText = game.controls;

            document.getElementById("info-tags").innerHTML = `
                <span class="bg-pink-100 text-pink-600 px-2 py-0.5 rounded-full text-[10px] font-bold">${game.categoryName}</span>
                <span class="bg-sky-100 text-sky-600 px-2 py-0.5 rounded-full text-[10px] font-bold">難度 ${game.difficulty}</span>
            `;

            document.getElementById("modal-game-info").classList.remove("hidden");
        }

        function launchRandomGame() {
            const randomIndex = Math.floor(Math.random() * GAMES_DATA.length);
            const randomGame = GAMES_DATA[randomIndex];
            showToast(`🎲 為你挑選：${randomGame.title}`, "fa-dice", "text-amber-400");
            setTimeout(() => launchGame(randomGame.id), 400);
        }

        function showToast(msg, iconClass = "fa-circle-check", iconColor = "text-emerald-400") {
            const toast = document.getElementById("toast");
            const msgEl = document.getElementById("toast-msg");
            const iconEl = document.getElementById("toast-icon");

            msgEl.innerText = msg;
            iconEl.className = `fa-solid ${iconClass} ${iconColor} text-base`;

            toast.classList.remove("translate-y-20", "opacity-0");
            toast.classList.add("translate-y-0", "opacity-100");

            setTimeout(() => {
                toast.classList.remove("translate-y-0", "opacity-100");
                toast.classList.add("translate-y-20", "opacity-0");
            }, 2200);
        }

        function setupEventListeners() {
            const searchInput = document.getElementById("search-input");
            const btnClearSearch = document.getElementById("btn-clear-search");

            searchInput.addEventListener("input", (e) => {
                searchQuery = e.target.value;
                currentPage = 1;
                if (searchQuery.length > 0) btnClearSearch.classList.remove("hidden");
                else btnClearSearch.classList.add("hidden");
                renderGamesGrid();
            });

            btnClearSearch.addEventListener("click", () => {
                searchInput.value = "";
                searchQuery = "";
                currentPage = 1;
                btnClearSearch.classList.add("hidden");
                renderGamesGrid();
            });

            document.getElementById("sort-select").addEventListener("change", (e) => {
                sortBy = e.target.value;
                currentPage = 1;
                renderGamesGrid();
            });

            const btnFavToggle = document.getElementById("btn-toggle-fav-only");
            const favToggleText = document.getElementById("fav-toggle-text");

            btnFavToggle.addEventListener("click", () => {
                favoritesOnly = !favoritesOnly;
                currentPage = 1;
                if (favoritesOnly) {
                    btnFavToggle.classList.add("bg-pink-500", "text-white");
                    favToggleText.innerText = "顯示全部";
                } else {
                    btnFavToggle.classList.remove("bg-pink-500", "text-white");
                    favToggleText.innerText = "只看收藏";
                }
                renderGamesGrid();
            });

            document.getElementById("btn-reset-filters").addEventListener("click", () => {
                currentCategory = "all";
                searchQuery = "";
                searchInput.value = "";
                favoritesOnly = false;
                currentPage = 1;
                renderCategoryTabs();
                renderGamesGrid();
            });

            document.getElementById("btn-random-game").addEventListener("click", launchRandomGame);

            document.getElementById("btn-close-player").addEventListener("click", () => {
                const modal = document.getElementById("modal-game-player");
                const iframe = document.getElementById("game-iframe");
                modal.classList.add("hidden");
                iframe.src = "";
            });

            document.getElementById("btn-close-info").addEventListener("click", () => {
                document.getElementById("modal-game-info").classList.add("hidden");
            });

            document.getElementById("btn-info-play-now").addEventListener("click", () => {
                document.getElementById("modal-game-info").classList.add("hidden");
                if (selectedGameForInfo) launchGame(selectedGameForInfo.id);
            });
        }
    </script>
</body>
</html>

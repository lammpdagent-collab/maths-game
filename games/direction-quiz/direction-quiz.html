<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>方向練習 & Bubble Shooter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; touch-action: manipulation; }
        .bubble-canvas { background: #1a202c; border-radius: 0.5rem; display: block; margin: 0 auto; box-shadow: inset 0 4px 6px rgba(0,0,0,0.3); max-width: 100%; max-height: 75vh; height: auto; aspect-ratio: 2 / 3; object-fit: contain; }
        .grid-cell { transition: all 0.2s ease-in-out; }
        .option-btn { transition: transform 0.1s; }
        .option-btn:active { transform: scale(0.95); }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Compass styling */
        .compass-container { position: relative; width: 100px; height: 100px; border-radius: 50%; border: 4px solid #4a5568; background: #e2e8f0; }
        @media (min-width: 768px) { .compass-container { width: 140px; height: 140px; border-width: 5px; } }
        .compass-line { position: absolute; top: 50%; left: 50%; width: 100%; height: 2px; background: #cbd5e0; transform-origin: center; transform: translate(-50%, -50%); }
        .compass-arrow-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: transform 0.5s ease-out; }
        .compass-arrow { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 25px solid #e53e3e; }
        @media (min-width: 768px) { .compass-arrow { top: 14px; border-left-width: 14px; border-right-width: 14px; border-bottom-width: 35px; } }
        .compass-north-label { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); font-weight: bold; color: #e53e3e; font-size: 14px; text-shadow: 1px 1px 0 #fff; }
        @media (min-width: 768px) { .compass-north-label { top: -12px; font-size: 18px; } }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-0 sm:p-4 md:p-8">

<div id="app" class="w-full md:max-w-3xl lg:max-w-4xl h-[100dvh] md:h-[95vh] md:max-h-[1000px] bg-white relative shadow-2xl overflow-hidden sm:rounded-2xl flex flex-col">
    
    <!-- START SCREEN -->
    <div id="screen-start" class="absolute inset-0 flex flex-col items-center justify-center p-6 md:p-12 bg-gradient-to-br from-blue-100 to-indigo-100 fade-in z-10">
        <h1 class="text-4xl md:text-6xl font-extrabold text-indigo-800 mb-6 md:mb-10 text-center">方向特訓營</h1>
        <p class="text-gray-700 text-center mb-8 md:mb-12 md:text-2xl md:leading-loose">
            先完成10題方向練習題！<br>
            答對10題：玩 60 秒 Bubble Shooter<br>
            答對8-9題：玩 45 秒<br>
            答對6-7題：玩 30 秒<br>
            5題或以下：需重新練習！
        </p>
        <button onclick="startQuiz()" class="px-8 py-4 md:px-12 md:py-6 bg-indigo-600 text-white rounded-full font-bold text-lg md:text-3xl shadow-lg hover:bg-indigo-700 transition">開始練習</button>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="screen-quiz" class="absolute inset-0 flex flex-col hidden bg-white fade-in z-10">
        <!-- Header -->
        <div class="flex justify-between items-center p-3 md:p-4 bg-indigo-600 text-white">
            <div class="font-bold md:text-xl">第 <span id="q-current">1</span>/10 題</div>
            <div class="font-bold md:text-xl">答對: <span id="q-score">0</span></div>
        </div>

        <div class="flex-1 overflow-y-auto p-4 md:px-8 flex flex-col items-center justify-evenly">
            <!-- Top Area: Grid & Compass -->
            <div class="flex flex-row w-full justify-around items-center mb-2 md:mb-4">
                <!-- 3x3 Grid -->
                <div id="animal-grid" class="grid grid-cols-3 gap-1 md:gap-2 bg-gray-200 p-2 md:p-3 rounded-xl shadow-inner">
                    <!-- dynamically populated -->
                </div>
                
                <!-- Compass -->
                <div class="flex flex-col items-center">
                    <div class="compass-container mb-1">
                        <div class="compass-line"></div>
                        <div class="compass-line" style="transform: translate(-50%, -50%) rotate(45deg);"></div>
                        <div class="compass-line" style="transform: translate(-50%, -50%) rotate(90deg);"></div>
                        <div class="compass-line" style="transform: translate(-50%, -50%) rotate(135deg);"></div>
                        <div id="compass-arrow" class="compass-arrow-container">
                            <div class="compass-north-label">北</div>
                            <div class="compass-arrow"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Question Text -->
            <div class="text-xl md:text-3xl font-bold text-center mb-2 md:mb-4 bg-indigo-50 p-3 md:p-4 rounded-lg w-full text-indigo-900 border border-indigo-100 min-h-[4rem] md:min-h-[6rem] flex items-center justify-center shadow-sm">
                <span id="question-text">題目載入中...</span>
            </div>

            <!-- Options: Animals -->
            <div class="w-full mb-2 md:mb-4">
                <div class="text-sm md:text-lg text-gray-500 mb-1 md:mb-2 font-bold">動物選項：</div>
                <div id="options-animals" class="grid grid-cols-5 gap-2">
                    <!-- dynamically populated -->
                </div>
            </div>

            <!-- Options: Directions -->
            <div class="w-full pb-2">
                <div class="text-sm md:text-lg text-gray-500 mb-1 md:mb-2 font-bold">方向選項：</div>
                <div id="options-directions" class="grid grid-cols-4 gap-2">
                    <!-- dynamically populated -->
                </div>
            </div>
        </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="screen-result" class="absolute inset-0 flex flex-col items-center justify-center p-6 md:p-12 bg-gradient-to-br from-green-50 to-blue-50 hidden fade-in z-20">
        <h2 id="result-title" class="text-4xl md:text-6xl font-extrabold mb-6 md:mb-10 text-center"></h2>
        <p id="result-desc" class="text-lg md:text-3xl text-gray-700 text-center mb-10 md:mb-16 md:leading-relaxed"></p>
        <button id="result-btn" class="px-8 py-4 md:px-12 md:py-6 bg-blue-600 text-white rounded-full font-bold text-lg md:text-3xl shadow-lg hover:bg-blue-700 transition"></button>
    </div>

    <!-- GAME SCREEN -->
    <div id="screen-game" class="absolute inset-0 flex flex-col hidden bg-gray-900 fade-in z-10">
        <!-- Game Header -->
        <div class="flex justify-between items-center p-4 md:p-6 bg-gray-800 text-white shadow-md">
            <div class="font-bold text-lg md:text-2xl text-yellow-400">分數: <span id="game-score">0</span></div>
            <div class="font-bold text-lg md:text-2xl text-red-400">時間: <span id="game-time">60</span>s</div>
        </div>
        
        <!-- Game Canvas Area -->
        <div class="flex-1 relative w-full flex justify-center items-center overflow-hidden touch-none p-2 md:p-6" id="canvas-container">
            <canvas id="gameCanvas" width="400" height="600" class="bubble-canvas"></canvas>
            
            <!-- Game Over Overlay -->
            <div id="game-over-overlay" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center hidden z-30">
                <h2 class="text-4xl md:text-6xl font-bold text-white mb-4 md:mb-8">遊戲結束</h2>
                <p class="text-xl md:text-3xl text-yellow-400 mb-8 md:mb-12">最終分數: <span id="final-score">0</span></p>
                <button onclick="resetApp()" class="px-6 py-3 md:px-10 md:py-5 bg-indigo-600 text-white rounded-full font-bold md:text-2xl shadow-lg hover:bg-indigo-700">重新挑戰</button>
            </div>
        </div>
    </div>

</div>

<script>
    /* --- CONFIG & DATA --- */
    const ALL_ANIMALS = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨'];
    const ALL_DIRS = ['北', '東北', '東', '東南', '南', '西南', '西', '西北'];
    
    // UI Elements
    const screens = {
        start: document.getElementById('screen-start'),
        quiz: document.getElementById('screen-quiz'),
        result: document.getElementById('screen-result'),
        game: document.getElementById('screen-game')
    };

    /* --- STATE --- */
    let quizState = {
        grid: [],
        compassOffset: 0,
        questions: [],
        currentIndex: 0,
        score: 0,
        awardedTime: 0
    };

    /* --- UTILS --- */
    function showScreen(name) {
        Object.values(screens).forEach(s => s.classList.add('hidden'));
        screens[name].classList.remove('hidden');
    }
    
    function shuffle(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    /* --- QUIZ LOGIC --- */
    function startQuiz() {
        quizState.score = 0;
        quizState.currentIndex = 0;
        quizState.grid = shuffle(ALL_ANIMALS);
        quizState.compassOffset = Math.floor(Math.random() * 8); 
        
        // Update Compass UI
        document.getElementById('compass-arrow').style.transform = `rotate(${quizState.compassOffset * 45}deg)`;
        
        // Render Grid
        const gridEl = document.getElementById('animal-grid');
        gridEl.innerHTML = '';
        quizState.grid.forEach(animal => {
            let div = document.createElement('div');
            div.className = 'w-14 h-14 md:w-20 md:h-20 flex items-center justify-center bg-white rounded-lg md:rounded-xl text-3xl md:text-5xl shadow-sm';
            div.innerText = animal;
            gridEl.appendChild(div);
        });

        generateQuestions();
        renderOptions();
        loadQuestion();
        showScreen('quiz');
    }

    // 取得相反方向的 Helper function
    function getOppositeDir(dirName) {
        let idx = ALL_DIRS.indexOf(dirName);
        return ALL_DIRS[(idx + 4) % 8];
    }

    // 取得特定起點與特定方向上的所有動物 (解決 edge case)
    function getAnimalsInDir(startAnimal, dirName) {
        let results = [];
        let startIndex = quizState.grid.indexOf(startAnimal);
        let xi = startIndex % 3, yi = Math.floor(startIndex / 3);
        
        for(let j = 0; j < 9; j++) {
            if(startIndex === j) continue;
            let xj = j % 3, yj = Math.floor(j / 3);
            let dx = xj - xi;
            let dy = yj - yi;
            if (dx === 0 || dy === 0 || Math.abs(dx) === Math.abs(dy)) {
                let angleVal = Math.round(Math.atan2(dy, dx) / (Math.PI / 4));
                let screenDirIdx = (angleVal + 2 + 8) % 8;
                let perceivedDirIdx = (screenDirIdx - quizState.compassOffset + 8) % 8;
                if (ALL_DIRS[perceivedDirIdx] === dirName) {
                    results.push(quizState.grid[j]);
                }
            }
        }
        return results;
    }

    function generateQuestions() {
        let validPairs = [];
        // Find all pairs that sit on a valid 8-direction line
        for(let i=0; i<9; i++) {
            for(let j=0; j<9; j++) {
                if(i===j) continue;
                let xi = i % 3, yi = Math.floor(i / 3);
                let xj = j % 3, yj = Math.floor(j / 3);
                let dx = xj - xi;
                let dy = yj - yi;
                
                // Must be straight line or exact diagonal
                if (dx === 0 || dy === 0 || Math.abs(dx) === Math.abs(dy)) {
                    // Calculate screen direction index (0 is Up, 2 is Right)
                    let angleVal = Math.round(Math.atan2(dy, dx) / (Math.PI / 4));
                    let screenDirIdx = (angleVal + 2 + 8) % 8;
                    // Apply compass rotation
                    let perceivedDirIdx = (screenDirIdx - quizState.compassOffset + 8) % 8;
                    
                    validPairs.push({
                        A: quizState.grid[i], // A
                        B: quizState.grid[j], // B
                        D: ALL_DIRS[perceivedDirIdx] // Perceived direction of B from A
                    });
                }
            }
        }
        
        validPairs = shuffle(validPairs);
        let qTypes = shuffle([1, 1, 2, 2, 3, 3, 4, 4, 5, 6]); // required distribution
        
        quizState.questions = [];
        for (let i = 0; i < 10; i++) {
            let p = validPairs[i]; // safe since there are at least ~40 valid pairs
            let t = qTypes[i];
            let q = { type: t, pair: p };
            
            // Templates: 現在改用 validAnswers 陣列來包含所有合理答案
            switch(t) {
                case 1: 
                    q.text = `${p.A}的${p.D}方是______。`; 
                    q.validAnswers = getAnimalsInDir(p.A, p.D); 
                    break;
                case 2: 
                    q.text = `${p.A}的______方是${p.B}。`; 
                    q.validAnswers = [p.D]; 
                    break;
                case 3: 
                    q.text = `${p.B}在${p.A}的______方。`; 
                    q.validAnswers = [p.D]; 
                    break;
                case 4: 
                    q.text = `______在${p.A}的${p.D}方。`; 
                    q.validAnswers = getAnimalsInDir(p.A, p.D); 
                    break;
                case 5: 
                    q.text = `______的${p.D}方是${p.B}。`; 
                    q.validAnswers = getAnimalsInDir(p.B, getOppositeDir(p.D)); 
                    break;
                case 6: 
                    q.text = `${p.B}在______的${p.D}方。`; 
                    q.validAnswers = getAnimalsInDir(p.B, getOppositeDir(p.D)); 
                    break;
            }
            quizState.questions.push(q);
        }
    }

    function renderOptions() {
        const animEl = document.getElementById('options-animals');
        const dirEl = document.getElementById('options-directions');
        animEl.innerHTML = ''; dirEl.innerHTML = '';
        
        ALL_ANIMALS.forEach(a => {
            let btn = document.createElement('button');
            btn.className = 'option-btn bg-white border border-gray-300 rounded-lg p-1 md:p-2 text-3xl md:text-4xl shadow-sm hover:bg-indigo-50';
            btn.innerText = a;
            btn.onclick = () => submitAnswer(btn, a);
            animEl.appendChild(btn);
        });
        
        ALL_DIRS.forEach(d => {
            let btn = document.createElement('button');
            btn.className = 'option-btn bg-white border border-gray-300 rounded-lg py-2 px-1 md:py-3 md:px-2 text-sm md:text-xl font-bold shadow-sm hover:bg-indigo-50 flex items-center justify-center';
            btn.innerText = d;
            btn.onclick = () => submitAnswer(btn, d);
            dirEl.appendChild(btn);
        });
    }

    function loadQuestion() {
        document.getElementById('q-current').innerText = quizState.currentIndex + 1;
        document.getElementById('q-score').innerText = quizState.score;
        document.getElementById('question-text').innerText = quizState.questions[quizState.currentIndex].text;
        
        // Reset buttons visual
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.classList.remove('bg-green-300', 'bg-red-300', 'border-green-500', 'border-red-500', 'text-white');
            btn.classList.add('bg-white');
            btn.disabled = false;
        });
    }

    function submitAnswer(btnEl, choice) {
        // Disable all to prevent spam
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
        
        let q = quizState.questions[quizState.currentIndex];
        
        // 檢查玩家的選擇是否存在於有效答案列表中
        let isCorrect = q.validAnswers.includes(choice);
        
        if (isCorrect) {
            quizState.score++;
            btnEl.classList.remove('bg-white');
            btnEl.classList.add('bg-green-300', 'border-green-500');
        } else {
            btnEl.classList.remove('bg-white');
            btnEl.classList.add('bg-red-300', 'border-red-500');
            // optionally highlight correct answer?
        }
        
        document.getElementById('q-score').innerText = quizState.score;
        
        setTimeout(() => {
            quizState.currentIndex++;
            if (quizState.currentIndex >= 10) {
                endQuiz();
            } else {
                loadQuestion();
            }
        }, 800);
    }

    function endQuiz() {
        showScreen('result');
        let title, desc, btnText, t = 0;
        
        if (quizState.score >= 10) t = 60;
        else if (quizState.score >= 8) t = 45;
        else if (quizState.score >= 6) t = 30;
        else t = 0;

        quizState.awardedTime = t;

        const titleEl = document.getElementById('result-title');
        const descEl = document.getElementById('result-desc');
        const btnEl = document.getElementById('result-btn');

        if (t > 0) {
            titleEl.innerText = "太棒了！";
            titleEl.className = "text-4xl font-extrabold mb-4 text-center text-green-600";
            descEl.innerHTML = `你答對了 ${quizState.score} 題！<br>獲得 <strong>${t}秒</strong> 遊戲時間。`;
            btnEl.innerText = "開始遊戲";
            btnEl.className = "px-8 py-4 bg-green-600 text-white rounded-full font-bold text-lg shadow-lg hover:bg-green-700 transition";
            btnEl.onclick = startBubbleGame;
        } else {
            titleEl.innerText = "再接再厲！";
            titleEl.className = "text-4xl font-extrabold mb-4 text-center text-red-600";
            descEl.innerHTML = `你只答對了 ${quizState.score} 題。<br>必須答對6題以上才能玩遊戲。`;
            btnEl.innerText = "重新做練習";
            btnEl.className = "px-8 py-4 bg-indigo-600 text-white rounded-full font-bold text-lg shadow-lg hover:bg-indigo-700 transition";
            btnEl.onclick = startQuiz;
        }
    }

    function resetApp() {
        showScreen('start');
    }

    /* --- BUBBLE SHOOTER GAME LOGIC --- */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const BUBBLE_RADIUS = 20;
    const DIAMETER = 40;
    const ROW_HEIGHT = DIAMETER * Math.sqrt(3) / 2; // ~34.64
    const BUBBLE_COLORS = ['#FF4136', '#0074D9', '#2ECC40', '#FFDC00', '#B10DC9'];
    const MAX_ROWS = 14;

    let gameConfig = {
        active: false,
        score: 0,
        timeLeft: 0,
        grid: [], // 2D array [row][col] storing color or null
        bubblesMoving: [],
        currentBubble: null,
        nextBubble: null,
        timerInterval: null,
        animationFrame: null,
        mouseX: 200,
        mouseY: 0
    };

    function startBubbleGame() {
        showScreen('game');
        document.getElementById('game-over-overlay').classList.add('hidden');
        
        gameConfig.score = 0;
        gameConfig.timeLeft = quizState.awardedTime;
        gameConfig.active = true;
        gameConfig.grid = [];
        gameConfig.bubblesMoving = [];
        
        updateGameUI();
        initGrid();
        reloadShooter();
        
        // Listeners for aiming and shooting
        canvas.addEventListener('mousemove', onAim);
        canvas.addEventListener('touchmove', onAimTouch, {passive: false});
        canvas.addEventListener('click', onShoot);
        canvas.addEventListener('touchend', onShoot, {passive: false});

        // Timers
        gameConfig.timerInterval = setInterval(() => {
            if (!gameConfig.active) return;
            gameConfig.timeLeft--;
            updateGameUI();
            if (gameConfig.timeLeft <= 0) {
                endBubbleGame();
            }
        }, 1000);

        gameLoop();
    }

    function updateGameUI() {
        document.getElementById('game-score').innerText = gameConfig.score;
        document.getElementById('game-time').innerText = gameConfig.timeLeft;
    }

    function initGrid() {
        for (let r = 0; r < MAX_ROWS; r++) {
            let cols = (r % 2 === 0) ? 10 : 9;
            let rowArr = new Array(cols).fill(null);
            // fill top 5 rows
            if (r < 5) {
                for (let c = 0; c < cols; c++) {
                    rowArr[c] = BUBBLE_COLORS[Math.floor(Math.random() * BUBBLE_COLORS.length)];
                }
            }
            gameConfig.grid.push(rowArr);
        }
    }

    function reloadShooter() {
        if (!gameConfig.nextBubble) {
            gameConfig.nextBubble = BUBBLE_COLORS[Math.floor(Math.random() * BUBBLE_COLORS.length)];
        }
        gameConfig.currentBubble = {
            x: 200, y: 560,
            color: gameConfig.nextBubble
        };
        gameConfig.nextBubble = BUBBLE_COLORS[Math.floor(Math.random() * BUBBLE_COLORS.length)];
    }

    function getGridCenter(r, c) {
        let x = (r % 2 === 0) ? (c * DIAMETER + BUBBLE_RADIUS) : (c * DIAMETER + DIAMETER);
        let y = r * ROW_HEIGHT + BUBBLE_RADIUS;
        return {x, y};
    }

    function onAim(e) {
        let rect = canvas.getBoundingClientRect();
        let scaleX = canvas.width / rect.width;
        let scaleY = canvas.height / rect.height;
        gameConfig.mouseX = (e.clientX - rect.left) * scaleX;
        gameConfig.mouseY = (e.clientY - rect.top) * scaleY;
    }
    
    function onAimTouch(e) {
        e.preventDefault();
        let rect = canvas.getBoundingClientRect();
        let scaleX = canvas.width / rect.width;
        let scaleY = canvas.height / rect.height;
        gameConfig.mouseX = (e.touches[0].clientX - rect.left) * scaleX;
        gameConfig.mouseY = (e.touches[0].clientY - rect.top) * scaleY;
    }

    function onShoot(e) {
        if(e) e.preventDefault();
        if (!gameConfig.active || !gameConfig.currentBubble || gameConfig.bubblesMoving.length > 0) return;
        
        let dx = gameConfig.mouseX - 200;
        let dy = gameConfig.mouseY - 560;
        if (dy >= 0) return; // Cant shoot downwards
        
        let angle = Math.atan2(dy, dx);
        let speed = 15;
        
        gameConfig.bubblesMoving.push({
            x: 200, y: 560,
            dx: Math.cos(angle) * speed,
            dy: Math.sin(angle) * speed,
            color: gameConfig.currentBubble.color
        });
        
        gameConfig.currentBubble = null;
    }

    function gameLoop() {
        if (!gameConfig.active) return;
        updatePhysics();
        drawGame();
        gameConfig.animationFrame = requestAnimationFrame(gameLoop);
    }

    function updatePhysics() {
        for (let i = gameConfig.bubblesMoving.length - 1; i >= 0; i--) {
            let b = gameConfig.bubblesMoving[i];
            b.x += b.dx;
            b.y += b.dy;
            
            // Wall bounce
            if (b.x <= BUBBLE_RADIUS) { b.x = BUBBLE_RADIUS; b.dx *= -1; }
            if (b.x >= canvas.width - BUBBLE_RADIUS) { b.x = canvas.width - BUBBLE_RADIUS; b.dx *= -1; }
            
            // Ceiling collision or Bubble collision
            let hit = false;
            if (b.y <= BUBBLE_RADIUS) {
                hit = true;
            } else {
                // Check dist with all grid bubbles
                for (let r = 0; r < MAX_ROWS; r++) {
                    let cols = (r % 2 === 0) ? 10 : 9;
                    for (let c = 0; c < cols; c++) {
                        if (gameConfig.grid[r][c]) {
                            let center = getGridCenter(r, c);
                            let dist = Math.hypot(b.x - center.x, b.y - center.y);
                            if (dist < DIAMETER - 2) {
                                hit = true;
                                break;
                            }
                        }
                    }
                    if (hit) break;
                }
            }
            
            if (hit) {
                gameConfig.bubblesMoving.splice(i, 1);
                snapBubble(b.x, b.y, b.color);
                reloadShooter();
            }
        }
    }

    function snapBubble(x, y, color) {
        let minDist = Infinity;
        let bestR = 0, bestC = 0;
        
        for (let r = 0; r < MAX_ROWS; r++) {
            let cols = (r % 2 === 0) ? 10 : 9;
            for (let c = 0; c < cols; c++) {
                if (!gameConfig.grid[r][c]) {
                    let center = getGridCenter(r, c);
                    let dist = Math.hypot(x - center.x, y - center.y);
                    if (dist < minDist) {
                        minDist = dist;
                        bestR = r; bestC = c;
                    }
                }
            }
        }
        
        gameConfig.grid[bestR][bestC] = color;
        checkMatches(bestR, bestC, color);
    }

    function getNeighbors(r, c) {
        let neighbors = [];
        let rOffsets = [-1, -1, 0, 0, 1, 1];
        let cOffsetsEven = [-1, 0, -1, 1, -1, 0];
        let cOffsetsOdd = [0, 1, -1, 1, 0, 1];
        
        for (let i = 0; i < 6; i++) {
            let nr = r + rOffsets[i];
            let nc = c + ((r % 2 === 0) ? cOffsetsEven[i] : cOffsetsOdd[i]);
            if (nr >= 0 && nr < MAX_ROWS) {
                let maxCols = (nr % 2 === 0) ? 10 : 9;
                if (nc >= 0 && nc < maxCols) {
                    neighbors.push({r: nr, c: nc});
                }
            }
        }
        return neighbors;
    }

    function checkMatches(startR, startC, color) {
        let visited = new Set();
        let queue = [{r: startR, c: startC}];
        let matchGroup = [];
        
        while (queue.length > 0) {
            let curr = queue.shift();
            let key = `${curr.r},${curr.c}`;
            if (visited.has(key)) continue;
            visited.add(key);
            
            if (gameConfig.grid[curr.r][curr.c] === color) {
                matchGroup.push(curr);
                let neighbors = getNeighbors(curr.r, curr.c);
                for (let n of neighbors) {
                    if (!visited.has(`${n.r},${n.c}`)) queue.push(n);
                }
            }
        }
        
        if (matchGroup.length >= 3) {
            matchGroup.forEach(m => gameConfig.grid[m.r][m.c] = null);
            gameConfig.score += matchGroup.length * 10;
            checkFloating();
        }
    }

    function checkFloating() {
        let visited = new Set();
        let queue = [];
        
        // start from top row
        for (let c = 0; c < 10; c++) {
            if (gameConfig.grid[0][c]) {
                queue.push({r: 0, c: c});
            }
        }
        
        while (queue.length > 0) {
            let curr = queue.shift();
            let key = `${curr.r},${curr.c}`;
            if (visited.has(key)) continue;
            visited.add(key);
            
            let neighbors = getNeighbors(curr.r, curr.c);
            for (let n of neighbors) {
                if (gameConfig.grid[n.r][n.c] && !visited.has(`${n.r},${n.c}`)) {
                    queue.push(n);
                }
            }
        }
        
        // Remove unvisited (floating)
        for (let r = 0; r < MAX_ROWS; r++) {
            let cols = (r % 2 === 0) ? 10 : 9;
            for (let c = 0; c < cols; c++) {
                if (gameConfig.grid[r][c] && !visited.has(`${r},${c}`)) {
                    gameConfig.grid[r][c] = null;
                    gameConfig.score += 20; // bonus for dropping
                }
            }
        }
        updateGameUI();
    }

    function drawGame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw grid
        for (let r = 0; r < MAX_ROWS; r++) {
            let cols = (r % 2 === 0) ? 10 : 9;
            for (let c = 0; c < cols; c++) {
                if (gameConfig.grid[r][c]) {
                    drawBubble(getGridCenter(r, c), gameConfig.grid[r][c]);
                }
            }
        }
        
        // Draw moving bubbles
        for (let b of gameConfig.bubblesMoving) {
            drawBubble(b, b.color);
        }
        
        // Draw shooter and aim line
        if (gameConfig.currentBubble && gameConfig.bubblesMoving.length === 0) {
            // aim line
            ctx.beginPath();
            ctx.moveTo(200, 560);
            ctx.lineTo(gameConfig.mouseX, gameConfig.mouseY);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.setLineDash([5, 5]);
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.setLineDash([]);
            
            drawBubble(gameConfig.currentBubble, gameConfig.currentBubble.color);
        }
        
        // Draw next indicator
        if (gameConfig.nextBubble) {
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.beginPath(); ctx.arc(100, 560, 10, 0, Math.PI*2); ctx.fill();
            drawBubble({x: 100, y: 560}, gameConfig.nextBubble, 10);
            ctx.fillStyle = '#fff';
            ctx.font = '12px sans-serif';
            ctx.fillText('Next', 85, 590);
        }
    }

    function drawBubble(pos, color, radius = BUBBLE_RADIUS) {
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, radius - 1, 0, Math.PI * 2);
        
        let grad = ctx.createRadialGradient(pos.x - radius/3, pos.y - radius/3, radius/10, pos.x, pos.y, radius);
        grad.addColorStop(0, '#fff');
        grad.addColorStop(0.2, color);
        grad.addColorStop(1, shadeColor(color, -30));
        
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 1;
        ctx.stroke();
    }
    
    // utility to darken hex color for 3D effect
    function shadeColor(color, percent) {
        let R = parseInt(color.substring(1,3),16);
        let G = parseInt(color.substring(3,5),16);
        let B = parseInt(color.substring(5,7),16);
        R = parseInt(R * (100 + percent) / 100);
        G = parseInt(G * (100 + percent) / 100);
        B = parseInt(B * (100 + percent) / 100);
        R = (R<255)?R:255;  
        G = (G<255)?G:255;  
        B = (B<255)?B:255;  
        let RR = ((R.toString(16).length==1)?"0"+R.toString(16):R.toString(16));
        let GG = ((G.toString(16).length==1)?"0"+G.toString(16):G.toString(16));
        let BB = ((B.toString(16).length==1)?"0"+B.toString(16):B.toString(16));
        return "#"+RR+GG+BB;
    }

    function endBubbleGame() {
        gameConfig.active = false;
        clearInterval(gameConfig.timerInterval);
        if (gameConfig.animationFrame) cancelAnimationFrame(gameConfig.animationFrame);
        
        document.getElementById('final-score').innerText = gameConfig.score;
        document.getElementById('game-over-overlay').classList.remove('hidden');
    }

</script>

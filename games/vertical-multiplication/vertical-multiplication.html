<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直式乘法練習 - Column Multiplication Trainer</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    * { font-family: 'Inter', 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #e8e8e8; color: #444; user-select: none; touch-action: manipulation; }

    /* ===== Neumorphism 三式 ===== */
    .neu-flat    { background: #e8e8e8; box-shadow: -5px -5px 15px #ffffff, 5px 5px 15px #d1d1d1; }
    .neu-pressed { background: #e8e8e8; box-shadow: inset -3px -3px 7px #ffffff, inset 3px 3px 7px #d1d1d1; }
    .neu-convex  { background: linear-gradient(145deg, #fafafa, #d4d4d4); box-shadow: -5px -5px 15px #ffffff, 5px 5px 15px #d1d1d1; }
    .neu-btn     { transition: all .15s ease; cursor: pointer; }
    .neu-btn:active { box-shadow: inset -3px -3px 7px #ffffff, inset 3px 3px 7px #d1d1d1; }

    /* ===== 直式格仔 ===== */
    #grid { display: grid; gap: 6px; }
    .cell {
        width: 56px; height: 56px; border-radius: 14px;
        display: flex; align-items: center; justify-content: center;
        font-size: 30px; font-weight: 600; color: #374151;
    }
    .cell.carry { width: 30px; height: 30px; border-radius: 9px; font-size: 17px; align-self: end; margin-bottom: 2px; }
    .cell.empty { background: #e8e8e8; box-shadow: inset -3px -3px 7px #ffffff, inset 3px 3px 7px #d1d1d1; color: #9ca3af; }
    .cell.filled { background: #e8e8e8; box-shadow: -3px -3px 8px #ffffff, 3px 3px 8px #d1d1d1; }
    .cell.given  { background: transparent; box-shadow: none; color: #1f2937; font-weight: 700; }
    .cell.given0 { background: transparent; box-shadow: none; color: #9ca3af; }
    .cell.hl     { box-shadow: inset -3px -3px 7px #ffffff, inset 3px 3px 7px #d1d1d1, 0 0 0 3px #fbbf24; border-radius: 14px; }
    .cell.cur    { box-shadow: inset -3px -3px 7px #ffffff, inset 3px 3px 7px #d1d1d1, 0 0 0 4px #f59e0b; animation: pulse 1s infinite; }
    .cell.ok     { box-shadow: -3px -3px 8px #ffffff, 3px 3px 8px #d1d1d1, 0 0 0 3px #86efac; }
    .cell.wrong  { box-shadow: inset -3px -3px 7px #ffffff, inset 3px 3px 7px #d1d1d1, 0 0 0 4px #f87171; color: #dc2626; animation: shake .3s; }
    .rowline     { border-top: 2.5px solid #9ca3af; border-radius: 0 !important; }
    @keyframes pulse { 0%,100% { box-shadow: inset -3px -3px 7px #fff, inset 3px 3px 7px #d1d1d1, 0 0 0 4px #f59e0b; } 50% { box-shadow: inset -3px -3px 7px #fff, inset 3px 3px 7px #d1d1d1, 0 0 0 4px #fde68a; } }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

    /* ===== 鍵盤 ===== */
    .key {
        width: 64px; height: 60px; border-radius: 16px; font-size: 26px; font-weight: 600; color: #374151;
        display: flex; align-items: center; justify-content: center;
    }
    .key-sm { width: 52px; height: 48px; font-size: 14px; border-radius: 13px; }
    .mode-btn { padding: 8px 14px; border-radius: 12px; font-size: 13px; font-weight: 600; color: #6b7280; }
    .mode-btn.active { color: #4f46e5; box-shadow: inset -3px -3px 7px #ffffff, inset 3px 3px 7px #d1d1d1; }

    input.cust { background: transparent; outline: none; text-align: center; }
</style>
</head>
<body class="min-h-screen flex flex-col">

<!-- Header -->
<header class="neu-flat rounded-2xl mx-4 mt-4 px-5 py-3 flex justify-between items-center flex-wrap gap-2">
    <div class="flex items-center gap-3">
        <div class="neu-convex w-10 h-10 rounded-xl flex items-center justify-center text-xl font-bold text-gray-600">×</div>
        <div>
            <h1 class="text-lg font-bold text-gray-700 leading-tight">直式乘法練習</h1>
            <p class="text-[11px] text-gray-400">COLUMN MULTIPLICATION TRAINER</p>
        </div>
    </div>
    <div class="flex gap-2 flex-wrap">
        <button id="m-1x2" class="neu-flat neu-btn mode-btn" onclick="setMode('1x2')">1位乘2位</button>
        <button id="m-2x2" class="neu-flat neu-btn mode-btn" onclick="setMode('2x2')">2位乘2位</button>
        <button id="m-2x3" class="neu-flat neu-btn mode-btn" onclick="setMode('2x3')">2位乘3位</button>
        <button id="m-cust" class="neu-flat neu-btn mode-btn" onclick="toggleCustom()">自訂題目</button>
    </div>
    <div class="text-xs text-gray-500 font-semibold whitespace-nowrap">
        ✅ 完成 <span id="stat-done" class="text-gray-700">0</span> 題 ｜ 🎯 零錯誤 <span id="stat-clean" class="text-gray-700">0</span> 題
    </div>
</header>

<!-- Custom input panel -->
<div id="custom-panel" class="hidden neu-flat rounded-2xl mx-4 mt-3 px-5 py-4 flex items-center justify-center gap-4 flex-wrap">
    <span class="text-sm text-gray-500">輸入題目：</span>
    <div class="neu-pressed rounded-xl px-3 py-2">
        <input id="cust-md" class="cust w-28 text-xl font-bold text-gray-700" inputmode="numeric" maxlength="3" placeholder="被乘數">
    </div>
    <span class="text-xl font-bold text-gray-500">×</span>
    <div class="neu-pressed rounded-xl px-3 py-2">
        <input id="cust-mr" class="cust w-20 text-xl font-bold text-gray-700" inputmode="numeric" maxlength="2" placeholder="乘數">
    </div>
    <button class="neu-convex neu-btn px-6 py-2.5 rounded-xl text-sm font-bold text-gray-600" onclick="startCustom()">開始</button>
    <span class="text-[11px] text-gray-400">被乘數 2-3 位，乘數 1-2 位</span>
</div>

<!-- Main -->
<main class="flex-1 flex items-center justify-center gap-6 px-4 py-4 flex-wrap lg:flex-nowrap">

    <!-- Worksheet -->
    <div class="neu-flat rounded-3xl p-6 flex flex-col items-center justify-center min-h-[420px]">
        <div id="grid"></div>
        <div id="hint" class="mt-5 neu-pressed rounded-xl px-5 py-2.5 text-sm font-semibold text-gray-500 min-h-[42px] flex items-center"></div>
    </div>

    <!-- Keypad -->
    <div class="neu-flat rounded-3xl p-5 flex flex-col gap-4 items-center">
        <div class="grid grid-cols-5 gap-3">
            <button class="key neu-convex neu-btn" onclick="pressDigit('1')">1</button>
            <button class="key neu-convex neu-btn" onclick="pressDigit('2')">2</button>
            <button class="key neu-convex neu-btn" onclick="pressDigit('3')">3</button>
            <button class="key neu-convex neu-btn" onclick="pressDigit('4')">4</button>
            <button class="key neu-convex neu-btn" onclick="pressDigit('5')">5</button>
            <button class="key neu-convex neu-btn" onclick="pressDigit('6')">6</button>
            <button class="key neu-convex neu-btn" onclick="pressDigit('7')">7</button>
            <button class="key neu-convex neu-btn" onclick="pressDigit('8')">8</button>
            <button class="key neu-convex neu-btn" onclick="pressDigit('9')">9</button>
            <button class="key neu-convex neu-btn" onclick="pressDigit('0')">0</button>
        </div>
        <div class="flex gap-3">
            <button class="key-sm neu-convex neu-btn px-4" onclick="nextQuestion()" style="width:auto">➡ 下一題</button>
            <button class="key-sm neu-convex neu-btn px-4" onclick="clearCurrent()" style="width:auto">↺ 清除本格</button>
        </div>
        <p class="text-[11px] text-gray-400 text-center max-w-[340px] leading-relaxed">依照序填寫：先乘數十位部分積（個位補0），再乘數個位部分積（有進位先填進位小格），最後相加。填錯會標紅，改正後先可以繼續。</p>
    </div>
</main>

<script>
/* ================= Audio ================= */
let audioCtx = null;
function beep(type) {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;
        const play = (f, dur, type2, vol) => {
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = type2; o.frequency.setValueAtTime(f, t);
            g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
            o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + dur);
        };
        if (type === 'ok') play(660, .12, 'sine', .18);
        else if (type === 'err') { play(180, .18, 'sawtooth', .15); }
        else if (type === 'done') [523, 659, 784].forEach((f, i) => setTimeout(() => {
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = 'sine'; o.frequency.value = f; g.gain.value = .15;
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + .3);
            o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + .3);
        }, i * 90));
    } catch (e) {}
}

/* ================= State ================= */
let mode = '2x2';
let md = [], mr = [];          // 被乘數 / 乘數 digit arrays (left→right)
let gridCols = 0;              // total grid columns (incl. × column)
let cells = {};                // key "r,c" → {el, ans, filled, fixed}
let steps = [];                // [{key, ans, hl:[keys], label}]
let stepIdx = 0;
let errsThisQ = 0;
let statDone = 0, statClean = 0;
const PLACE = ['個位','十位','百位','千位','萬位'];

/* ================= Generation ================= */
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function genQuestion() {
    if (mode === '1x2')      { md = digits(randInt(10, 99));  mr = digits(randInt(2, 9)); }
    else if (mode === '2x2') { md = digits(randInt(10, 99));  mr = digits(randInt(10, 99)); }
    else if (mode === '2x3') { md = digits(randInt(100, 999)); mr = digits(randInt(10, 99)); }
    buildPuzzle();
}

function digits(n) { return String(n).split('').map(Number); }

/* ================= Build puzzle ================= */
function buildPuzzle() {
    cells = {}; steps = []; stepIdx = 0; errsThisQ = 0;
    gridCols = md.length + mr.length + 1;   // +1 for × column

    // rows: 0 = pp2 carries, 1 = pp1 carries, 2 = question, 3 = pp1, 4 = pp2, 5 = sum carries, 6 = sum
    const hasPP2 = mr.length >= 2;
    const rowsDef = hasPP2
        ? [['c2',30],['c1',30],['q',58],['p1',58],['p2',58],['cs',30],['sum',58]]
        : [['c1',30],['q',58],['p1',58]];

    // ---- question row (given) ----
    md.forEach((d, i) => setCell('q', 1 + i, d, 'given'));
    setSym('q', 0, '×');
    mr.forEach((d, i) => setCell('q', 1 + md.length + i, d, 'given'));

    // ---- partial products ----
    if (hasPP2) {
        // pp1 = md × mr[0] (tens), ones shifted left by 1 (個位補0), fill right-to-left
        setCell('p1', gridCols - 2, 0, 'given0');           // 補0 auto
        addPartialSteps('p1', mr[0], gridCols - 2, 1);
        // pp2 = md × mr[1] (ones), ones at rightmost
        addPartialSteps('p2', mr[1], gridCols - 1, 0);
        // sum: column by column right-to-left
        addSumSteps(hasPP2);
    } else {
        // 1-digit multiplier: single partial product = answer
        addPartialSteps('p1', mr[0], gridCols - 1, 0);
    }

    // ensure every step cell exists (pp digits, carries, sum digits)
    steps.forEach(st => {
        if (!cells[st.key]) {
            const [r, c] = st.key.split(':');
            setCell(r, Number(c), '', 'empty');
        }
    });

    renderGrid(rowsDef);
    showStep();
}

/* partial product steps: right-to-left, digit cell then carry cell */
function addPartialSteps(row, mulDigit, onesCol, placeOffset) {
    const carryRow = row === 'p1' ? 'c1' : 'c2';
    const mCellKey = 'q:' + (mr.length === 1 ? 1 + md.length : (row === 'p1' ? 1 + md.length : 2 + md.length));
    let carry = 0, p = 0;
    while (p < md.length || carry > 0) {
        const dig = p < md.length ? md[md.length - 1 - p] : null;
        const prod = (dig !== null ? dig * mulDigit : 0) + carry;
        const col = onesCol - p;
        const placeIdx = placeOffset + p;
        const labelTail = (row === 'p1' && placeOffset === 1 && p === 0) ? '（個位補0）' : '';
        const hl = [];
        if (dig !== null) hl.push('q:' + (1 + (md.length - 1 - p)));
        hl.push(mCellKey);
        steps.push({
            key: row + ':' + col, ans: prod % 10, hl,
            label: `${dig} × ${mulDigit}` + (carry ? ` + 進位${carry}` : '') + ` → ${PLACE[Math.min(placeIdx,4)]}${labelTail}`
        });
        if (prod >= 10) {
            steps.push({
                key: carryRow + ':' + (col - 1), ans: Math.floor(prod / 10), hl,
                label: `進位 ${Math.floor(prod / 10)}（${dig} × ${mulDigit} = ${prod}）`
            });
        }
        carry = Math.floor(prod / 10);
        p++;
    }
}

/* sum steps */
function addSumSteps(hasPP2) {
    const pp1 = {}, pp2 = {};
    // reconstruct partial product values digit-by-digit by place
    // pp1 is shifted one place left (個位補0) → ×10
    const v1 = md.reduce((a, d) => a * 10 + d, 0) * mr[0] * 10;
    const v2 = md.reduce((a, d) => a * 10 + d, 0) * mr[1];
    digits(v1).forEach((d, i, arr) => pp1[arr.length - 1 - i] = d);   // place → digit
    digits(v2).forEach((d, i, arr) => pp2[arr.length - 1 - i] = d);
    const maxP = Math.max(v1, v2).toString().length;
    let carry = 0;
    for (let p = 0; p < maxP; p++) {
        const a = pp1[p] || 0, b = pp2[p] || 0;
        const col = gridCols - 1 - p;
        const s = a + b + carry;
        const hl = [];
        if (p < v1.toString().length) hl.push('p1:' + (gridCols - 2 - p));
        hl.push('p2:' + col);
        if (carry) hl.push('cs:' + col);
        steps.push({
            key: 'sum:' + col, ans: s % 10, hl,
            label: `${a} + ${b}` + (carry ? ` + 進位${carry}` : '') + ` → ${PLACE[Math.min(p,4)]}`
        });
        if (s >= 10 && p < maxP - 1) {
            steps.push({
                key: 'cs:' + (col - 1), ans: Math.floor(s / 10), hl,
                label: `進位 ${Math.floor(s / 10)}（${a} + ${b}${carry ? ' + ' + carry : ''} = ${s}）`
            });
        }
        carry = Math.floor(s / 10);
    }
    // leading carry becomes top digit of sum
    if (carry > 0) {
        const col = gridCols - 1 - maxP;
        steps.push({ key: 'sum:' + col, ans: carry, hl: ['cs:' + (col + 1)], label: `進位 ${carry} → ${PLACE[Math.min(maxP,4)]}` });
    }
}

/* ================= Render ================= */
function setCell(row, col, val, cls) {
    cells[row + ':' + col] = { row, col, val, cls, fixed: cls === 'given' || cls === 'given0' };
}
function setSym(row, col, sym) {
    cells[row + ':' + col] = { row, col, sym, cls: 'sym', fixed: true };
}

function renderGrid(rowsDef) {
    const g = document.getElementById('grid');
    g.innerHTML = '';
    g.style.gridTemplateColumns = `52px repeat(${gridCols - 1}, 56px)`;
    g.style.gridTemplateRows = rowsDef.map(r => r[1] + 'px').join(' ');
    const rowIdx = {}; rowsDef.forEach((r, i) => rowIdx[r[0]] = i);

    for (const key in cells) {
        const c = cells[key];
        const el = document.createElement('div');
        el.id = 'cell-' + key.replace(':', '_');
        el.className = 'cell ' + c.cls;
        if (c.sym) { el.textContent = c.sym; el.style.fontSize = '34px'; el.style.color = '#6b7280'; el.style.fontWeight = '700'; el.style.background = 'transparent'; el.style.boxShadow = 'none'; }
        else el.textContent = c.fixed ? c.val : '';
        if (c.cls === 'given0') { el.textContent = '0'; }
        if (c.row === 'p1') el.classList.add('rowline');
        if (c.row === 'sum') el.classList.add('rowline');
        if (key.startsWith('c1') || key.startsWith('c2') || key.startsWith('cs')) el.classList.add('carry');
        el.style.gridRow = rowIdx[c.row] + 1;
        el.style.gridColumn = c.col + 1;
        g.appendChild(el);
        c.el = el;
    }
}

/* ================= Step flow ================= */
function showStep() {
    // clear highlights
    for (const k in cells) if (cells[k].el) cells[k].el.classList.remove('hl', 'cur', 'wrong');
    if (stepIdx >= steps.length) { questionDone(); return; }
    const st = steps[stepIdx];
    st.hl.forEach(k => { const c = cells[k]; if (c && c.el) c.el.classList.add('hl'); });
    const cur = cells[st.key];
    cur.el.classList.add('cur');
    cur._ans = st.ans;
    document.getElementById('hint').innerHTML = `🧠 <span class="text-amber-600">${st.label}</span>`;
}

function pressDigit(d) {
    if (stepIdx >= steps.length) return;
    const st = steps[stepIdx];
    const cur = cells[st.key];
    if (cur.filled) return;
    if (String(st.ans) === d) {
        cur.el.textContent = d;
        cur.filled = true;
        cur.el.classList.remove('cur', 'hl', 'wrong');
        cur.el.classList.add('filled', 'ok');
        beep('ok');
        setTimeout(() => cur.el.classList.remove('ok'), 400);
        stepIdx++;
        showStep();
    } else {
        errsThisQ++;
        cur.el.classList.add('wrong');
        cur.el.textContent = d;
        setTimeout(() => { cur.el.textContent = ''; cur.el.classList.remove('wrong'); }, 600);
        beep('err');
    }
}

function clearCurrent() {
    if (stepIdx >= steps.length) return;
    const cur = cells[steps[stepIdx].key];
    cur.el.textContent = '';
    cur.el.classList.remove('wrong');
}

function questionDone() {
    document.getElementById('hint').innerHTML = `🎉 <span class="text-emerald-600">完成！${md.join('')} × ${mr.join('')} = ${md.reduce((a,d)=>a*10+d,0) * mr.reduce((a,d)=>a*10+d,0)}</span>`;
    beep('done');
    statDone++;
    if (errsThisQ === 0) statClean++;
    updateStats();
    setTimeout(nextQuestion, 1400);
}

function nextQuestion() { genQuestion(); }

function updateStats() {
    document.getElementById('stat-done').textContent = statDone;
    document.getElementById('stat-clean').textContent = statClean;
}

/* ================= Modes ================= */
function setMode(m) {
    mode = m;
    document.getElementById('custom-panel').classList.add('hidden');
    ['1x2','2x2','2x3','cust'].forEach(k => {
        document.getElementById('m-' + k).classList.toggle('active', k === m);
    });
    if (m !== 'cust') genQuestion();
}
function toggleCustom() {
    document.getElementById('custom-panel').classList.toggle('hidden');
}
function startCustom() {
    const a = document.getElementById('cust-md').value.trim();
    const b = document.getElementById('cust-mr').value.trim();
    if (!/^\d{2,3}$/.test(a)) { flashCustomErr('cust-md'); return; }
    if (!/^\d{1,2}$/.test(b)) { flashCustomErr('cust-mr'); return; }
    md = digits(Number(a)); mr = digits(Number(b));
    document.getElementById('custom-panel').classList.add('hidden');
    buildPuzzle();
}
function flashCustomErr(id) {
    const el = document.getElementById(id);
    el.classList.add('text-red-500');
    setTimeout(() => el.classList.remove('text-red-500'), 800);
}

/* init */
setMode('2x2');
</script>
</body>
</html>

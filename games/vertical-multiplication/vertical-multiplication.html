<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>日系小學直式乘法大挑戰</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PixiJS v7 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Zen Maru Gothic -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }
        body {
            font-family: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #E6EDF5;
            color: #334155;
            overflow: hidden;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
        }
        
        /* Neumorphism Design Tokens */
        .neu-bg {
            background-color: #E6EDF5;
        }
        .neu-flat {
            background: #E6EDF5;
            box-shadow: 8px 8px 18px #c2cddb, -8px -8px 18px #ffffff;
        }
        .neu-pressed {
            background: #E6EDF5;
            box-shadow: inset 4px 4px 10px #c2cddb, inset -4px -4px 10px #ffffff;
        }
        .neu-btn {
            background: #E6EDF5;
            box-shadow: 5px 5px 12px #c2cddb, -5px -5px 12px #ffffff;
            transition: all 0.15s ease-in-out;
            color: #334155;
        }
        .neu-btn:hover {
            box-shadow: 7px 7px 15px #bba5cd, -7px -7px 15px #ffffff;
        }
        .neu-btn:active {
            box-shadow: inset 3px 3px 8px #c2cddb, inset -3px -3px 8px #ffffff;
            transform: scale(0.97);
        }
        .neu-btn-active {
            background: #E6EDF5;
            box-shadow: inset 4px 4px 9px #b8c4d4, inset -4px -4px 9px #ffffff;
            color: #059669;
            font-weight: 900;
        }
        .neu-card {
            background: #E6EDF5;
            box-shadow: inset 3px 3px 8px #c2cddb, inset -3px -3px 8px #ffffff;
        }
        .modal-blur {
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden neu-bg">

    <header class="h-16 px-6 my-2 mx-4 neu-flat rounded-2xl flex items-center justify-between z-10 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl neu-flat flex items-center justify-center text-emerald-600 font-bold text-xl">
                ✕
            </div>
            <div>
                <h1 class="text-lg md:text-xl font-black text-slate-700 tracking-wide">直式乘法大挑戰</h1>
                <p class="text-xs text-slate-400 font-bold">小學數學運算練習（Neumorphism 版）</p>
            </div>
        </div>

        <!-- Mode Selector Bar -->
        <div class="flex items-center neu-pressed p-1.5 rounded-2xl gap-1.5">
            <button id="btn-mode-1x2" onclick="setGameMode('1x2')" class="px-3.5 py-1.5 text-xs md:text-sm font-bold rounded-xl transition-all text-slate-600">
                1位 × 2位
            </button>
            <button id="btn-mode-2x2" onclick="setGameMode('2x2')" class="px-3.5 py-1.5 text-xs md:text-sm font-bold rounded-xl transition-all neu-btn-active">
                2位 × 2位
            </button>
            <button id="btn-mode-2x3" onclick="setGameMode('2x3')" class="px-3.5 py-1.5 text-xs md:text-sm font-bold rounded-xl text-slate-600 transition-all">
                2位 × 3位
            </button>
            <button id="btn-mode-custom" onclick="openCustomModal()" class="px-3.5 py-1.5 text-xs md:text-sm font-bold rounded-xl text-slate-600 transition-all flex items-center gap-1">
                <i class="fa-solid fa-pen-to-square"></i> 自訂
            </button>
        </div>

        <!-- Right Side Controls & Streaks -->
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 neu-pressed px-4 py-1.5 rounded-2xl">
                <i class="fa-solid fa-star text-amber-400 text-lg"></i>
                <span id="streak-counter" class="text-slate-700 font-black text-base">0</span>
                <span class="text-xs text-slate-400 font-bold">連勝</span>
            </div>
            <button id="hint-btn" onclick="toggleHint()" class="px-3.5 py-1.5 rounded-2xl neu-btn flex items-center gap-1.5 text-xs md:text-sm font-bold text-slate-600" title="提示開關">
                <i id="hint-icon" class="fa-regular fa-lightbulb text-slate-400 text-base"></i>
                <span>提示</span>
            </button>
            <button onclick="generateNewProblem()" class="w-10 h-10 rounded-2xl neu-btn flex items-center justify-center text-slate-600" title="換一題">
                <i class="fa-solid fa-rotate text-lg"></i>
            </button>
            <button id="sound-btn" onclick="toggleSound()" class="w-10 h-10 rounded-2xl neu-btn flex items-center justify-center text-slate-600">
                <i id="sound-icon" class="fa-solid fa-volume-high text-lg"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-row relative overflow-hidden p-4 gap-5">
        
        <!-- PixiJS Canvas Container -->
        <div id="canvas-container" class="flex-1 neu-pressed rounded-3xl relative overflow-hidden flex items-center justify-center p-2">
            <!-- Canvas dynamically appended -->
        </div>

        <!-- Virtual Keypad for iPad Input -->
        <div class="w-80 neu-flat rounded-3xl p-5 flex flex-col justify-between shrink-0">
            <!-- Current Step Instruction Box -->
            <div id="instruction-card" class="neu-card rounded-2xl p-3.5 mb-2 flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl neu-btn text-emerald-600 flex items-center justify-center font-black shrink-0 text-base" id="step-number-badge">
                    1
                </div>
                <div class="flex-1">
                    <p id="instruction-text" class="text-xs md:text-sm font-bold text-slate-700 leading-tight">
                        請按數字鍵填入目前高亮的位置
                    </p>
                </div>
            </div>

            <!-- Virtual Numpad Grid -->
            <div class="grid grid-cols-3 gap-3.5 flex-1 my-3">
                <button onclick="handleKeypadInput(7)" class="neu-btn rounded-2xl text-3xl font-black flex items-center justify-center">7</button>
                <button onclick="handleKeypadInput(8)" class="neu-btn rounded-2xl text-3xl font-black flex items-center justify-center">8</button>
                <button onclick="handleKeypadInput(9)" class="neu-btn rounded-2xl text-3xl font-black flex items-center justify-center">9</button>
                
                <button onclick="handleKeypadInput(4)" class="neu-btn rounded-2xl text-3xl font-black flex items-center justify-center">4</button>
                <button onclick="handleKeypadInput(5)" class="neu-btn rounded-2xl text-3xl font-black flex items-center justify-center">5</button>
                <button onclick="handleKeypadInput(6)" class="neu-btn rounded-2xl text-3xl font-black flex items-center justify-center">6</button>
                
                <button onclick="handleKeypadInput(1)" class="neu-btn rounded-2xl text-3xl font-black flex items-center justify-center">1</button>
                <button onclick="handleKeypadInput(2)" class="neu-btn rounded-2xl text-3xl font-black flex items-center justify-center">2</button>
                <button onclick="handleKeypadInput(3)" class="neu-btn rounded-2xl text-3xl font-black flex items-center justify-center">3</button>
                
                <button onclick="handleKeypadInput(0)" class="col-span-3 neu-btn rounded-2xl text-3xl font-black flex items-center justify-center py-3">0</button>
            </div>

            <!-- Skip Control -->
            <div class="flex gap-2 mt-1">
                <button onclick="generateNewProblem()" class="w-full py-3 neu-btn text-slate-600 font-bold rounded-2xl text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-forward"></i> 跳過換下一題
                </button>
            </div>
        </div>
    </main>

    <!-- Custom Problem Modal -->
    <div id="custom-modal" class="fixed inset-0 bg-slate-900/20 modal-blur z-50 flex items-center justify-center hidden">
        <div class="neu-flat rounded-3xl p-6 w-96 flex flex-col gap-4">
            <div class="flex justify-between items-center border-b border-slate-300/50 pb-3">
                <h3 class="text-lg font-black text-slate-700">自訂題目</h3>
                <button onclick="closeCustomModal()" class="w-8 h-8 rounded-xl neu-btn text-slate-400 hover:text-slate-600 text-sm flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1.5">被乘數 (Multiplicand)</label>
                    <input type="number" id="custom-num1" min="1" max="999" placeholder="例如: 59" class="w-full neu-pressed rounded-xl px-4 py-3 text-lg font-bold text-slate-700 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1.5">乘數 (Multiplier)</label>
                    <input type="number" id="custom-num2" min="1" max="99" placeholder="例如: 26" class="w-full neu-pressed rounded-xl px-4 py-3 text-lg font-bold text-slate-700 focus:outline-none">
                </div>
            </div>

            <div class="flex gap-3 pt-2">
                <button onclick="closeCustomModal()" class="flex-1 py-3 neu-btn text-slate-600 font-bold rounded-xl text-sm">取消</button>
                <button onclick="applyCustomProblem()" class="flex-1 py-3 neu-btn text-emerald-600 font-bold rounded-xl text-sm">開始練習</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast Message -->
    <div id="toast-message" class="fixed top-20 left-1/2 -translate-x-1/2 neu-flat text-slate-700 font-bold px-6 py-3.5 rounded-2xl shadow-lg opacity-0 pointer-events-none transition-all duration-300 z-50 text-sm flex items-center gap-2.5">
        <i id="toast-icon" class="fa-solid fa-circle-info"></i>
        <span id="toast-text">提示訊息</span>
    </div>

    <script>
        class SoundEffects {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playTone(freq, type, duration, delay = 0) {
                if (!this.enabled) return;
                this.init();
                setTimeout(() => {
                    try {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = type;
                        osc.frequency.value = freq;
                        
                        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

                        osc.connect(gain);
                        gain.connect(this.ctx.destination);

                        osc.start();
                        osc.stop(this.ctx.currentTime + duration);
                    } catch(e){}
                }, delay * 1000);
            }

            playCorrect() {
                this.playTone(523.25, 'sine', 0.12, 0);   // C5
                this.playTone(659.25, 'sine', 0.2, 0.08); // E5
            }

            playError() {
                this.playTone(180, 'sawtooth', 0.2, 0);
            }

            playSuccess() {
                this.playTone(523.25, 'triangle', 0.12, 0);   // C5
                this.playTone(659.25, 'triangle', 0.12, 0.1);  // E5
                this.playTone(783.99, 'triangle', 0.12, 0.2);  // G5
                this.playTone(1046.50, 'triangle', 0.4, 0.3);  // C6
            }
        }

        const soundFX = new SoundEffects();
        let soundEnabled = true;

        function toggleSound() {
            soundEnabled = !soundEnabled;
            soundFX.enabled = soundEnabled;
            const icon = document.getElementById('sound-icon');
            icon.className = soundEnabled ? 'fa-solid fa-volume-high text-lg' : 'fa-solid fa-volume-xmark text-lg text-stone-400';
        }

        function showToast(msg, isSuccess = true) {
            const toast = document.getElementById('toast-message');
            const toastText = document.getElementById('toast-text');
            const toastIcon = document.getElementById('toast-icon');

            toastText.innerText = msg;
            toastIcon.className = isSuccess ? 'fa-solid fa-circle-check text-emerald-400' : 'fa-solid fa-triangle-exclamation text-amber-400';
            
            toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 1800);
        }
    </script>

    <script>
        // State variables
        let currentMode = '2x2'; // '1x2', '2x2', '2x3', 'custom'
        let multiplicand = 24;
        let multiplier = 13;
        let streak = 0;
        let showHints = false; // Toggle for student highlighters and detailed keypad hints

        function toggleHint() {
            showHints = !showHints;
            const hintBtn = document.getElementById('hint-btn');
            const hintIcon = document.getElementById('hint-icon');
            if (showHints) {
                hintBtn.classList.add('neu-btn-active');
                hintIcon.className = 'fa-solid fa-lightbulb text-amber-500 text-base';
            } else {
                hintBtn.classList.remove('neu-btn-active');
                hintIcon.className = 'fa-regular fa-lightbulb text-slate-400 text-base';
            }
            if (typeof renderGrid === 'function') {
                renderGrid();
            }
            updateInstruction();
        }

        let stepsList = [];
        let currentStepIndex = 0;
        let completedSteps = {}; // id -> number

        // Helper: Chinese column name
        function getColChineseName(offsetFromRight) {
            const names = ['個', '十', '百', '千', '萬'];
            return names[offsetFromRight] || '';
        }

        // Calculate Steps according to school curriculum rules
        function calculateSteps(num1, num2) {
            const steps = [];
            const num1Str = num1.toString();
            const num2Str = num2.toString();

            const isTwoDigitMultiplier = num2Str.length >= 2;
            const isMultipleOfTen = (num2 % 10 === 0);

            // CASE 1: 2-digit multiplier ending in 0 (e.g., 50, 20...) -> Single Row Answer (Row 2)
            if (isTwoDigitMultiplier && isMultipleOfTen) {
                const tensDigit = parseInt(num2Str[0]);

                // Step 1: Fill '0' in Row 2 Ones place
                steps.push({
                    id: 'row1_pad0',
                    type: 'digit',
                    row: 2,
                    colOffsetFromRight: 0,
                    expected: 0,
                    prompt: `乘數為整十數（${tensDigit}0），個位先填 0`,
                    hint: `💡 提示：乘數個位是 0，先在個位填入 0`,
                    hlMultiplicandIndex: null,
                    hlMultiplierDigitIndex: 1
                });

                let carry = 0;
                let colOffset = 0;

                for (let i = num1Str.length - 1; i >= 0; i--) {
                    const d1 = parseInt(num1Str[i]);
                    const prod = d1 * tensDigit + carry;
                    const digitToWrite = prod % 10;
                    const newCarry = Math.floor(prod / 10);

                    steps.push({
                        id: `row1_prod_${colOffset}`,
                        type: 'digit',
                        row: 2,
                        colOffsetFromRight: colOffset + 1,
                        expected: digitToWrite,
                        prompt: `請計算：${d1} × ${tensDigit}${carry > 0 ? '（加進位 ' + carry + '）' : ''}`,
                        hint: `💡 提示：${d1} × ${tensDigit}${carry > 0 ? ' + 進位 ' + carry : ''} = ${prod}，填數 ${digitToWrite}`,
                        hlMultiplicandIndex: i,
                        hlMultiplierDigitIndex: 0
                    });

                    if (newCarry > 0) {
                        steps.push({
                            id: `row1_carry_${colOffset}`,
                            type: 'carry',
                            row: 1, // Rest on bottom line of row 1 (multiplier row)
                            carryBetweenColLeft: colOffset + 2, // Shifted left by 1 because of padded 0
                            carryBetweenColRight: colOffset + 1,
                            expected: newCarry,
                            prompt: `請填入十位進位數字`,
                            hint: `💡 提示：滿十進位，請輸入進位 ${newCarry}`,
                            hlMultiplicandIndex: i,
                            hlMultiplierDigitIndex: 0
                        });
                    }

                    carry = newCarry;
                    colOffset++;
                }

                if (carry > 0) {
                    steps.push({
                        id: `row1_final_carry_digit`,
                        type: 'digit',
                        row: 2,
                        colOffsetFromRight: colOffset + 1,
                        expected: carry,
                        prompt: `請填入最高位進位`,
                        hint: `💡 提示：將最高位進位 ${carry} 填入`,
                        hlMultiplicandIndex: null,
                        hlMultiplierDigitIndex: 0
                    });
                }

                return steps;
            }

            // CASE 2: Standard 2-digit multiplier (not ending in 0)
            if (isTwoDigitMultiplier) {
                // PHASE 1: Tens digit of Multiplier -> Output on Row 2
                const tensDigit = parseInt(num2Str[0]);

                steps.push({
                    id: 'row1_pad0',
                    type: 'digit',
                    row: 2,
                    colOffsetFromRight: 0,
                    expected: 0,
                    prompt: `先算十位（${tensDigit}0 倍），個位先填 0`,
                    hint: `💡 提示：先算十位 ${tensDigit}0 倍，個位先填 0`,
                    hlMultiplicandIndex: null,
                    hlMultiplierDigitIndex: 0
                });

                let carry1 = 0;
                let colOffset1 = 0;

                for (let i = num1Str.length - 1; i >= 0; i--) {
                    const d1 = parseInt(num1Str[i]);
                    const prod = d1 * tensDigit + carry1;
                    const digitToWrite = prod % 10;
                    const newCarry = Math.floor(prod / 10);

                    steps.push({
                        id: `row1_prod_${colOffset1}`,
                        type: 'digit',
                        row: 2,
                        colOffsetFromRight: colOffset1 + 1,
                        expected: digitToWrite,
                        prompt: `請計算：${d1} × ${tensDigit}${carry1 > 0 ? '（加進位 ' + carry1 + '）' : ''}`,
                        hint: `💡 提示：${d1} × ${tensDigit}${carry1 > 0 ? ' + 進位 ' + carry1 : ''} = ${prod}，填數 ${digitToWrite}`,
                        hlMultiplicandIndex: i,
                        hlMultiplierDigitIndex: 0
                    });

                    if (newCarry > 0) {
                        steps.push({
                            id: `row1_carry_${colOffset1}`,
                            type: 'carry',
                            row: 1, // On bottom line of row 1
                            carryBetweenColLeft: colOffset1 + 2, // Shifted left by 1
                            carryBetweenColRight: colOffset1 + 1,
                            expected: newCarry,
                            prompt: `請填入十位進位數字`,
                            hint: `💡 提示：滿十進位，請輸入進位 ${newCarry}`,
                            hlMultiplicandIndex: i,
                            hlMultiplierDigitIndex: 0
                        });
                    }

                    carry1 = newCarry;
                    colOffset1++;
                }

                if (carry1 > 0) {
                    steps.push({
                        id: `row1_final_carry_digit`,
                        type: 'digit',
                        row: 2,
                        colOffsetFromRight: colOffset1 + 1,
                        expected: carry1,
                        prompt: `請填入最高位進位`,
                        hint: `💡 提示：最高位進位填入 ${carry1}`,
                        hlMultiplicandIndex: null,
                        hlMultiplierDigitIndex: 0
                    });
                }

                // PHASE 2: Ones digit of Multiplier -> Output on Row 3
                const onesDigit = parseInt(num2Str[num2Str.length - 1]);
                let carry2 = 0;
                let colOffset2 = 0;

                for (let i = num1Str.length - 1; i >= 0; i--) {
                    const d1 = parseInt(num1Str[i]);
                    const prod = d1 * onesDigit + carry2;
                    const digitToWrite = prod % 10;
                    const newCarry = Math.floor(prod / 10);

                    steps.push({
                        id: `row2_prod_${colOffset2}`,
                        type: 'digit',
                        row: 3,
                        colOffsetFromRight: colOffset2,
                        expected: digitToWrite,
                        prompt: `請計算：${d1} × ${onesDigit}${carry2 > 0 ? '（加進位 ' + carry2 + '）' : ''}`,
                        hint: `💡 提示：${d1} × ${onesDigit}${carry2 > 0 ? ' + 進位 ' + carry2 : ''} = ${prod}，填數 ${digitToWrite}`,
                        hlMultiplicandIndex: i,
                        hlMultiplierDigitIndex: num2Str.length - 1
                    });

                    if (newCarry > 0) {
                        steps.push({
                            id: `row2_carry_${colOffset2}`,
                            type: 'carry',
                            row: 2, // Rest on bottom line of row 2
                            carryBetweenColLeft: colOffset2 + 1,
                            carryBetweenColRight: colOffset2,
                            expected: newCarry,
                            prompt: `請填入個位進位數字`,
                            hint: `💡 提示：滿十進位，請輸入進位 ${newCarry}`,
                            hlMultiplicandIndex: i,
                            hlMultiplierDigitIndex: num2Str.length - 1
                        });
                    }

                    carry2 = newCarry;
                    colOffset2++;
                }

                if (carry2 > 0) {
                    steps.push({
                        id: `row2_final_carry_digit`,
                        type: 'digit',
                        row: 3,
                        colOffsetFromRight: colOffset2,
                        expected: carry2,
                        prompt: `請填入最高位進位`,
                        hint: `💡 提示：最高位進位填入 ${carry2}`,
                        hlMultiplicandIndex: null,
                        hlMultiplierDigitIndex: num2Str.length - 1
                    });
                }

                // PHASE 3: Addition Phase -> Output on Row 4
                const row1Val = num1 * (Math.floor(num2 / 10) * 10);
                const row2Val = num1 * (num2 % 10);
                const finalSum = row1Val + row2Val;

                let sumCarry = 0;
                const maxLen = Math.max(row1Val.toString().length, row2Val.toString().length, finalSum.toString().length);

                for (let c = 0; c < maxLen; c++) {
                    const d1 = Math.floor(row1Val / Math.pow(10, c)) % 10;
                    const d2 = Math.floor(row2Val / Math.pow(10, c)) % 10;
                    
                    const colSum = d1 + d2 + sumCarry;
                    const digitToWrite = colSum % 10;
                    const newSumCarry = Math.floor(colSum / 10);

                    steps.push({
                        id: `sum_digit_${c}`,
                        type: 'digit',
                        row: 4,
                        colOffsetFromRight: c,
                        expected: digitToWrite,
                        prompt: `兩列部分積相加：計算第 ${getColChineseName(c)} 位數`,
                        hint: `💡 提示：${d1} + ${d2}${sumCarry > 0 ? ' + 進位 ' + sumCarry : ''} = ${colSum}，填寫 ${digitToWrite}`,
                        hlMultiplicandIndex: null,
                        hlMultiplierDigitIndex: null
                    });

                    if (newSumCarry > 0 && c < maxLen - 1) {
                        steps.push({
                            id: `sum_carry_${c}`,
                            type: 'carry',
                            row: 3, // Rest on bottom line of row 3
                            carryBetweenColLeft: c + 1,
                            carryBetweenColRight: c,
                            expected: newSumCarry,
                            prompt: `請填入相加的進位數字`,
                            hint: `💡 提示：兩列相加滿十進位，請輸入進位 ${newSumCarry}`,
                            hlMultiplicandIndex: null,
                            hlMultiplierDigitIndex: null
                        });
                    }

                    sumCarry = newSumCarry;
                }

            } else {
                // CASE 3: 1-digit multiplier (e.g. 89 x 5)
                const onesDigit = parseInt(num2Str[0]);
                let carry = 0;
                let colOffset = 0;

                for (let i = num1Str.length - 1; i >= 0; i--) {
                    const d1 = parseInt(num1Str[i]);
                    const prod = d1 * onesDigit + carry;
                    const digitToWrite = prod % 10;
                    const newCarry = Math.floor(prod / 10);

                    steps.push({
                        id: `row1_prod_${colOffset}`,
                        type: 'digit',
                        row: 2,
                        colOffsetFromRight: colOffset,
                        expected: digitToWrite,
                        prompt: `請計算：${d1} × ${onesDigit}${carry > 0 ? '（加進位 ' + carry + '）' : ''}`,
                        hint: `💡 提示：${d1} × ${onesDigit}${carry > 0 ? ' + 進位 ' + carry : ''} = ${prod}，填數 ${digitToWrite}`,
                        hlMultiplicandIndex: i,
                        hlMultiplierDigitIndex: 0
                    });

                    if (newCarry > 0) {
                        steps.push({
                            id: `row1_carry_${colOffset}`,
                            type: 'carry',
                            row: 1, // Rest on line under multiplier
                            carryBetweenColLeft: colOffset + 1,
                            carryBetweenColRight: colOffset,
                            expected: newCarry,
                            prompt: `請填入進位數字`,
                            hint: `💡 提示：滿十進位，請輸入進位 ${newCarry}`,
                            hlMultiplicandIndex: i,
                            hlMultiplierDigitIndex: 0
                        });
                    }

                    carry = newCarry;
                    colOffset++;
                }

                if (carry > 0) {
                    steps.push({
                        id: `row1_final_carry_digit`,
                        type: 'digit',
                        row: 2,
                        colOffsetFromRight: colOffset,
                        expected: carry,
                        prompt: `請填入最高位進位`,
                        hint: `💡 提示：最高位進位填入 ${carry}`,
                        hlMultiplicandIndex: null,
                        hlMultiplierDigitIndex: 0
                    });
                }
            }

            return steps;
        }
    </script>

    <script>
        let app = null;
        let gridContainer = null;
        let targetPulseGraphics = null;

        const COLOR_BG_CANVAS = 0xE6EDF5;
        const COLOR_BG_GRID = 0xEEF3F9;
        const COLOR_BORDER = 0xC8D3E0;
        const COLOR_TEXT = 0x334155;
        const COLOR_HIGHLIGHT_BG = 0xFDE68A; // Light amber
        const COLOR_HIGHLIGHT_TEXT = 0xD97706; // Vibrant amber
        const COLOR_PULSE_DIGIT = 0x10B981; // Green
        const COLOR_PULSE_CARRY = 0xEF4444; // Red

        window.onload = function () {
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            app = new PIXI.Application({
                width: width,
                height: height,
                backgroundColor: COLOR_BG_CANVAS,
                resolution: window.devicePixelRatio || 1,
                autoDensity: true,
                antialias: true
            });

            container.appendChild(app.view);

            gridContainer = new PIXI.Container();
            targetPulseGraphics = new PIXI.Container();
            
            app.stage.addChild(gridContainer);
            app.stage.addChild(targetPulseGraphics);

            window.addEventListener('resize', handleResize);

            generateNewProblem();
        };

        function handleResize() {
            if (!app) return;
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            app.renderer.resize(width, height);
            renderGrid();
        }

        function generateNewProblem() {
            if (currentMode === '1x2') {
                multiplicand = Math.floor(Math.random() * 89) + 10; // 10..98
                multiplier = Math.floor(Math.random() * 8) + 2;     // 2..9
            } else if (currentMode === '2x2') {
                multiplicand = Math.floor(Math.random() * 89) + 10; // 10..98
                multiplier = Math.floor(Math.random() * 89) + 10;   // 10..98
            } else if (currentMode === '2x3') {
                multiplicand = Math.floor(Math.random() * 899) + 100; // 100..998
                multiplier = Math.floor(Math.random() * 89) + 10;     // 10..98
            }

            startProblem(multiplicand, multiplier);
        }

        function setGameMode(mode) {
            currentMode = mode;
            ['1x2', '2x2', '2x3', 'custom'].forEach(m => {
                const btn = document.getElementById(`btn-mode-${m}`);
                if (btn) {
                    if (m === mode) {
                        btn.className = "px-3.5 py-1.5 text-xs md:text-sm font-bold rounded-xl transition-all neu-btn-active";
                    } else {
                        btn.className = "px-3.5 py-1.5 text-xs md:text-sm font-bold rounded-xl transition-all text-slate-600";
                    }
                }
            });

            if (mode !== 'custom') {
                generateNewProblem();
            }
        }

        function openCustomModal() {
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeCustomModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        function applyCustomProblem() {
            const num1Input = parseInt(document.getElementById('custom-num1').value);
            const num2Input = parseInt(document.getElementById('custom-num2').value);

            if (isNaN(num1Input) || isNaN(num2Input) || num1Input <= 0 || num2Input <= 0) {
                showToast('請輸入有效的正整數！', false);
                return;
            }

            multiplicand = num1Input;
            multiplier = num2Input;
            currentMode = 'custom';
            setGameMode('custom');
            closeCustomModal();
            startProblem(multiplicand, multiplier);
        }

        function startProblem(num1, num2) {
            multiplicand = num1;
            multiplier = num2;
            completedSteps = {};
            currentStepIndex = 0;

            stepsList = calculateSteps(multiplicand, multiplier);
            renderGrid();
            updateInstruction();
        }

        function renderGrid() {
            gridContainer.removeChildren();
            targetPulseGraphics.removeChildren();

            const num1Str = multiplicand.toString();
            const num2Str = multiplier.toString();

            const isTwoDigit = num2Str.length >= 2;
            const isMultipleOfTen = (multiplier % 10 === 0);
            const hasAdditionPhase = isTwoDigit && !isMultipleOfTen;

            const maxCols = Math.max(num1Str.length + num2Str.length + 1, 5);
            const maxRows = hasAdditionPhase ? 5 : 3; 

            const cellW = 70;
            const cellH = 70;
            const startX = (app.screen.width - maxCols * cellW) / 2;
            const startY = (app.screen.height - maxRows * cellH) / 2;

            const currentStep = stepsList[currentStepIndex];

            // 1. Column Titles
            const headers = ['千位', '百位', '十位', '個位'];
            for (let c = 0; c < maxCols; c++) {
                const headerText = headers[headers.length - (maxCols - c)];
                if (headerText) {
                    const txt = new PIXI.Text(headerText, {
                        fontFamily: 'Zen Maru Gothic',
                        fontSize: 14,
                        fontWeight: '700',
                        fill: 0xA09D96
                    });
                    txt.anchor.set(0.5);
                    txt.position.set(startX + c * cellW + cellW / 2, startY - 22);
                    gridContainer.addChild(txt);
                }
            }

            // 2. Draw Grid Boxes
            for (let r = 0; r < maxRows; r++) {
                for (let c = 0; c < maxCols; c++) {
                    const x = startX + c * cellW;
                    const y = startY + r * cellH;

                    const box = new PIXI.Graphics();
                    box.lineStyle(1.5, COLOR_BORDER, 1);
                    box.beginFill(COLOR_BG_GRID);
                    box.drawRoundedRect(x + 2, y + 2, cellW - 4, cellH - 4, 12);
                    box.endFill();
                    gridContainer.addChild(box);
                }
            }

            // 3. Multiplication Operator '✕' (Positioned leftwards)
            const opSign = new PIXI.Text('✕', {
                fontFamily: 'Zen Maru Gothic',
                fontSize: 32,
                fontWeight: '900',
                fill: 0x8D8A83
            });
            opSign.anchor.set(0.5);
            const opCol = Math.max(0, maxCols - Math.max(num1Str.length, num2Str.length) - 2);
            opSign.position.set(startX + opCol * cellW + cellW / 2, startY + 1 * cellH + cellH / 2);
            gridContainer.addChild(opSign);

            // Line 1 under Multiplier Row
            const line1 = new PIXI.Graphics();
            line1.lineStyle(3.5, 0x5D5A53, 1);
            line1.moveTo(startX, startY + 2 * cellH);
            line1.lineTo(startX + maxCols * cellW, startY + 2 * cellH);
            gridContainer.addChild(line1);

            // Line 2 under Second Partial Product Row (Only drawn when addition phase is present)
            if (hasAdditionPhase) {
                const line2 = new PIXI.Graphics();
                line2.lineStyle(3.5, 0x4A4A4A, 1);
                line2.moveTo(startX, startY + 4 * cellH);
                line2.lineTo(startX + maxCols * cellW, startY + 4 * cellH);
                gridContainer.addChild(line2);
            }

            // 4. Render Multiplicand (Row 0) with active highlight
            for (let i = 0; i < num1Str.length; i++) {
                const colOffset = num1Str.length - 1 - i;
                const c = maxCols - 1 - colOffset;
                const x = startX + c * cellW + cellW / 2;
                const y = startY + 0 * cellH + cellH / 2;

                const isHL = (currentStep && currentStep.hlMultiplicandIndex === i);

                if (isHL) {
                    const hlBox = new PIXI.Graphics();
                    hlBox.beginFill(COLOR_HIGHLIGHT_BG);
                    hlBox.drawRoundedRect(startX + c * cellW + 4, startY + 4, cellW - 8, cellH - 8, 10);
                    hlBox.endFill();
                    gridContainer.addChild(hlBox);
                }

                const txt = new PIXI.Text(num1Str[i], {
                    fontFamily: 'Zen Maru Gothic',
                    fontSize: 38,
                    fontWeight: '900',
                    fill: isHL ? COLOR_HIGHLIGHT_TEXT : COLOR_TEXT
                });
                txt.anchor.set(0.5);
                txt.position.set(x, y);
                gridContainer.addChild(txt);
            }

            // 5. Render Multiplier (Row 1) with active highlight
            for (let i = 0; i < num2Str.length; i++) {
                const colOffset = num2Str.length - 1 - i;
                const c = maxCols - 1 - colOffset;
                const x = startX + c * cellW + cellW / 2;
                const y = startY + 1 * cellH + cellH / 2;

                const isHL = (currentStep && currentStep.hlMultiplierDigitIndex === i);

                if (isHL) {
                    const hlBox = new PIXI.Graphics();
                    hlBox.beginFill(COLOR_HIGHLIGHT_BG);
                    hlBox.drawRoundedRect(startX + c * cellW + 4, startY + 1 * cellH + 4, cellW - 8, cellH - 8, 10);
                    hlBox.endFill();
                    gridContainer.addChild(hlBox);
                }

                const txt = new PIXI.Text(num2Str[i], {
                    fontFamily: 'Zen Maru Gothic',
                    fontSize: 38,
                    fontWeight: '900',
                    fill: isHL ? COLOR_HIGHLIGHT_TEXT : COLOR_TEXT
                });
                txt.anchor.set(0.5);
                txt.position.set(x, y);
                gridContainer.addChild(txt);
            }

            // 6. Render Completed Steps
            stepsList.forEach(step => {
                if (completedSteps[step.id] !== undefined) {
                    const val = completedSteps[step.id];

                    if (step.type === 'digit') {
                        const c = maxCols - 1 - step.colOffsetFromRight;
                        const r = step.row;
                        const x = startX + c * cellW + cellW / 2;
                        const y = startY + r * cellH + cellH / 2;

                        const txt = new PIXI.Text(val.toString(), {
                            fontFamily: 'Zen Maru Gothic',
                            fontSize: 38,
                            fontWeight: '900',
                            fill: 0x065F46 // Deep Emerald
                        });
                        txt.anchor.set(0.5);
                        txt.position.set(x, y);
                        gridContainer.addChild(txt);
                    } else if (step.type === 'carry') {
                        // Carry rests directly on bottom line of step.row
                        const cLeft = maxCols - 1 - step.carryBetweenColLeft;
                        const x = startX + (cLeft + 1) * cellW; // Intersection line
                        const y = startY + (step.row + 1) * cellH; // Bottom line of step.row

                        const badge = new PIXI.Graphics();
                        badge.beginFill(0xFEE2E2);
                        badge.lineStyle(1.5, 0xEF4444, 1);
                        badge.drawCircle(x, y, 11);
                        badge.endFill();
                        gridContainer.addChild(badge);

                        const txt = new PIXI.Text(val.toString(), {
                            fontFamily: 'Zen Maru Gothic',
                            fontSize: 13,
                            fontWeight: '900',
                            fill: 0xDC2626
                        });
                        txt.anchor.set(0.5);
                        txt.position.set(x, y);
                        gridContainer.addChild(txt);
                    }
                }
            });

            // 7. Render Active Target Pulse Indicator
            if (currentStep) {
                if (currentStep.type === 'digit') {
                    const c = maxCols - 1 - currentStep.colOffsetFromRight;
                    const r = currentStep.row;
                    const x = startX + c * cellW;
                    const y = startY + r * cellH;

                    const ring = new PIXI.Graphics();
                    ring.lineStyle(3, COLOR_PULSE_DIGIT, 0.9);
                    ring.beginFill(0x10B981, 0.12);
                    ring.drawRoundedRect(x + 3, y + 3, cellW - 6, cellH - 6, 12);
                    ring.endFill();
                    targetPulseGraphics.addChild(ring);
                } else if (currentStep.type === 'carry') {
                    const cLeft = maxCols - 1 - currentStep.carryBetweenColLeft;
                    const x = startX + (cLeft + 1) * cellW;
                    const y = startY + (currentStep.row + 1) * cellH;

                    const pulseCircle = new PIXI.Graphics();
                    pulseCircle.lineStyle(2.5, COLOR_PULSE_CARRY, 0.9);
                    pulseCircle.beginFill(0xEF4444, 0.2);
                    pulseCircle.drawCircle(x, y, 12);
                    pulseCircle.endFill();
                    targetPulseGraphics.addChild(pulseCircle);
                }
            }
        }

        function handleKeypadInput(num) {
            if (currentStepIndex >= stepsList.length) return;

            const currentStep = stepsList[currentStepIndex];

            if (num === currentStep.expected) {
                // Correct Input!
                soundFX.playCorrect();
                completedSteps[currentStep.id] = num;
                currentStepIndex++;

                if (currentStepIndex >= stepsList.length) {
                    // Problem Completed!
                    soundFX.playSuccess();
                    streak++;
                    document.getElementById('streak-counter').innerText = streak;
                    showToast('恭喜答對！連勝 +1 🎉', true);

                    renderGrid();
                    document.getElementById('instruction-text').innerText = "太棒了！全題解答正確！";
                    document.getElementById('step-number-badge').innerText = "✓";

                    setTimeout(() => {
                        generateNewProblem();
                    }, 2200);
                } else {
                    renderGrid();
                    updateInstruction();
                }
            } else {
                // Wrong Input
                soundFX.playError();
                showToast('算錯囉，再試一次看看！', false);
            }
        }

        function updateInstruction() {
            if (currentStepIndex < stepsList.length) {
                const step = stepsList[currentStepIndex];
                document.getElementById('instruction-text').innerText = step.instruction;
                document.getElementById('step-number-badge').innerText = currentStepIndex + 1;
            }
        }
    </script>

    <script>
        function updateInstruction() {
            if (currentStepIndex < stepsList.length) {
                const step = stepsList[currentStepIndex];
                const instructionText = showHints ? step.hint : step.prompt;
                document.getElementById('instruction-text').innerText = instructionText;
                document.getElementById('step-number-badge').innerText = currentStepIndex + 1;
            }
        }
    </script>
